name: agora

# Infra for v1: the two-store belief base (Influx series + Fuseki :attested) and
# Grafana for eyeballing the series. All images have arm64 builds, so this runs on
# the Raspberry Pi as-is.
#
# MQTT is NOT here: the Alpine/musl mosquitto image can't open a config file on this
# Pi's kernel (rootless overlay), so the broker runs on the host instead (apt install
# mosquitto — a glibc build). See README. The gateway/agents are host processes too,
# so a host broker is architecturally consistent.

services:
  influxdb:
    image: docker.io/library/influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-admin12345}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-agora}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-sensors}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dev-token-change-me}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on: [influxdb]

  fuseki:
    image: docker.io/secoresearch/fuseki:5.5.0
    ports: ["3030:3030"]
    # Run Fuseki Main against OUR config (generated by `agora-acl` from genesis/world.ttl),
    # not the image's built-in single-dataset assembler. FUSEKI_BASE points somewhere empty
    # so the image does not also load its own.
    environment:
      FUSEKI_BASE: /tmp/fuseki-base
    # Rootless podman maps container-root to YOUR uid, so this reads the 0600 credential
    # files without making them world-readable on the host. No host privilege is gained.
    user: "0:0"
    entrypoint: ["sh", "-c"]
    command:
      - >-
        mkdir -p /tmp/fuseki-base/configuration &&
        exec java -cp '/jena-fuseki/fuseki-server.jar:/javalibs/*'
        org.apache.jena.fuseki.main.cmds.FusekiServerCmd
        --config=/fuseki-config/config.ttl --port=3030
    volumes:
      - ./infra/fuseki:/fuseki-config:ro     # generated: who may read which graph
      - ./keys/fuseki:/fuseki-secrets:ro     # per-agent credentials, never committed
      - fuseki-data:/fuseki-data             # the belief base SURVIVES a container rebuild
    # Two doors over one store (see knowledge/decisions/belief-base-isolation.md):
    #   /ds     secured — an agent reads the shared graphs and its own beliefs, nothing else
    #   /ds-rw  plain   — updates for every agent, whole-graph read/write for admin only

volumes:
  influxdb-data:
  fuseki-data:
  grafana-data:
