# GENERATED by `orexis-compose dispatcher` from the world beside it — do not edit.
#
# The roster is the world. Add an agent there, regenerate, and it is deployed; there is no second
# list to keep in step. Run `orexis-influx dispatcher` first, then from this directory:
#
#   cd world/dispatcher && podman compose up -d
#   cd world/dispatcher && podman compose logs -f

name: orexis-dispatcher

# podman-compose puts every service in one pod by default, and a pod cannot combine with the
# per-service user-namespace mapping below. Ignored by docker compose.
x-podman:
  in_pod: false

services:

  agent-dispatcher:
    image: orexis:local
    command: ["orexis-agent", "/app/world/dispatcher", "dispatcher", "--volume", "/app/state"]
    environment:
      # where each series it writes goes, and the org — the store the installation says serves each
      # purpose, its metrics only where the world is monitored — safe for every agent to hold
      INFLUX_HISTORY_URL: "http://localhost:8086"
      INFLUX_HISTORY_ORG: "orexis"
    env_file:
      # its own bucket per purpose and a token that opens only it, minted by `orexis-influx dispatcher`;
      # mounted into THIS container alone — the world has no bus, so no broker credential
      - ./secrets/influx-history-dispatcher.env
    network_mode: host
    # Rootless podman maps YOUR uid into the container; map it onto the image's user so the agent
    # can write its own belief-base volume.
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: unless-stopped
    volumes:
      # its own belief base, and nobody else can name it
      - orexis-dispatcher-dispatcher:/app/state
      # the world's documents, file by file, at the path its imports of the domains resolve from
      - ./desires.ttl:/app/world/dispatcher/desires.ttl:ro
      - ./state.ttl:/app/world/dispatcher/state.ttl:ro
      - ./world.ttl:/app/world/dispatcher/world.ttl:ro
      # The trees, mounted so a code change needs a restart rather than a rebuild — the SAME ones
      # the Containerfile copies, which `tests/test_layout.py` holds the two lists to.
      - ../../agent:/app/agent:ro
      - ../../domains:/app/domains:ro
      - ../../simulation:/app/simulation:ro

volumes:
  orexis-dispatcher-dispatcher:
