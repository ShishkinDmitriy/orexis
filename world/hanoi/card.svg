<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="960" height="640" fill="#fbfaf7"/><clipPath id="sc"><rect x="30" y="30" width="900" height="410" rx="18"/></clipPath><g clip-path="url(#sc)"><rect x="30" y="30" width="900" height="410" fill="#f1ece2"/><rect x="30" y="30" width="900" height="410" fill="#f1ece2"/><rect x="150" y="330" width="660" height="22" rx="8" fill="#a98763"/><rect x="254" y="140" width="12" height="192" rx="5" fill="#8a6a48"/><text x="260" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="#6b5236">peg A</text><rect x="474" y="140" width="12" height="192" rx="5" fill="#8a6a48"/><text x="480" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="#6b5236">peg B</text><rect x="694" y="140" width="12" height="192" rx="5" fill="#8a6a48"/><text x="700" y="384" text-anchor="middle" font-size="15" font-weight="700" fill="#6b5236">peg C</text><rect x="206.0" y="310.0" width="108.0" height="20.0" rx="8.0" fill="#b8483a" stroke="#6d2e22" stroke-width="1"/><rect x="218.0" y="288.0" width="84.0" height="20.0" rx="8.0" fill="#e07a3f" stroke="#6d2e22" stroke-width="1"/><rect x="230.0" y="266.0" width="60.0" height="20.0" rx="8.0" fill="#f2b134" stroke="#6d2e22" stroke-width="1"/><g opacity=".55"><rect x="646.0" y="310.0" width="108.0" height="20.0" rx="8.0" fill="#b8483a" stroke="#6d2e22" stroke-dasharray="5 4" fill-opacity="0" stroke-width="1"/><rect x="658.0" y="288.0" width="84.0" height="20.0" rx="8.0" fill="#e07a3f" stroke="#6d2e22" stroke-dasharray="5 4" fill-opacity="0" stroke-width="1"/><rect x="670.0" y="266.0" width="60.0" height="20.0" rx="8.0" fill="#f2b134" stroke="#6d2e22" stroke-dasharray="5 4" fill-opacity="0" stroke-width="1"/></g><path d="M300,130 C400,75 600,75 670,130" fill="none" stroke="#23262b" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M670,130 l-4,-13 l-9,8 z" fill="#23262b"/><text x="480" y="62" text-anchor="middle" font-size="14" fill="#6b6f76">one move: the top disk to a peg where it lands on a larger one</text><text x="70" y="100" font-size="14" fill="#6b6f76">no grid,</text><text x="70" y="120" font-size="14" fill="#6b6f76">no van,</text><text x="70" y="140" font-size="14" fill="#6b6f76">no sensor</text></g><rect x="30" y="30" width="900" height="410" rx="18" fill="none" stroke="#e1ddd3"/><text x="30" y="492" font-size="30" font-weight="800" fill="#23262b">world/hanoi<tspan dx="18" font-size="17" font-weight="400" fill="#6b6f76">a pure mind with one move</tspan></text><text x="30" y="524" font-size="16" fill="#23262b">Three disks from peg A to peg C. The agent senses nothing and owes nobody: a test of the search alone.</text><rect x="30" y="544" width="63.800000000000004" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="61.900000000000006" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">1 agent</text><rect x="101.80000000000001" y="544" width="56.400000000000006" height="26" rx="13" fill="#fff" stroke="#d5d7db"/><text x="130.0" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9aa0a8">no van</text><rect x="166.20000000000002" y="544" width="63.800000000000004" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="198.10000000000002" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">3 disks</text><rect x="238.00000000000003" y="544" width="130.4" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="303.20000000000005" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">a want, one-shot</text><rect x="376.40000000000003" y="544" width="63.800000000000004" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="408.3" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">1 level</text><rect x="448.20000000000005" y="544" width="108.2" height="26" rx="13" fill="#fff" stroke="#d5d7db"/><text x="502.30000000000007" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#9aa0a8">no constraint</text></svg>