# GENERATED by `orexis-compose driver` from the world beside it — do not edit.
#
# The roster is the world. Add an agent there, regenerate, and it is deployed; there is no second
# list to keep in step. Run `orexis-influx driver` first, then from this directory:
#
#   cd world/driver && podman compose up -d
#   cd world/driver && podman compose logs -f

name: orexis-driver

# podman-compose puts every service in one pod by default, and a pod cannot combine with the
# per-service user-namespace mapping below. Ignored by docker compose.
x-podman:
  in_pod: false

services:

  agent-dispatcher:
    image: orexis-driver-dispatcher:local
    build:
      context: ../..
      dockerfile: Containerfile
      args:
        # the packages it runs and what they bring beyond the core, and nothing else's
        PACKAGES: "belief,execution,planning"
        EXTRAS: "belief,series"
        SIMULATOR: "no"
    command: ["orexis-agent", "/app/world/driver", "dispatcher", "--volume", "/app/state", "--journal", "/app/journal"]
    environment:
      # where each series it writes goes, and the org — the store the installation says serves each
      # purpose, its metrics only where the world is monitored — safe for every agent to hold
      INFLUX_HISTORY_URL: "http://localhost:8086"
      INFLUX_HISTORY_ORG: "orexis"
      # where it serves its journal, on the host's loopback, allocated by the installation
      JOURNAL_PORT: "7882"
    env_file:
      # its own bucket per purpose and a token that opens only it, minted by `orexis-influx driver`;
      # mounted into THIS container alone — the world has no bus, so no broker credential
      - ./secrets/dispatcher/influx-history.env
    network_mode: host
    # Rootless podman maps YOUR uid into the container; map it onto the image's user so the agent
    # can write its own belief-base volume.
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: unless-stopped
    volumes:
      # its own belief base, and nobody else can name it
      - orexis-driver-dispatcher:/app/state
      # its journal, a store of its own beside the beliefs and apart from them
      - orexis-driver-dispatcher-journal:/app/journal
      # the world's documents, file by file, at the path its imports of the domains resolve from
      - ./constraints.ttl:/app/world/driver/constraints.ttl:ro
      - ./desires.ttl:/app/world/driver/desires.ttl:ro
      - ./state.ttl:/app/world/driver/state.ttl:ro
      - ./world.ttl:/app/world/driver/world.ttl:ro
      - ./beliefs/dispatcher.self.ttl:/app/world/driver/beliefs/dispatcher.self.ttl:ro
      # its own secrets, whole: its credentials, its certificate, and every document only it is handed — written
      # by onboarding and by hand, never committed, and mounted into THIS container alone
      - ./secrets/dispatcher:/app/world/driver/secrets/dispatcher:ro
      # The trees, mounted so a code change needs a restart rather than a rebuild — the SAME entries its
      # image keeps, the kernel and its own packages and no other's, which `tests/test_layout.py` holds
      # to `agent.tree.kept`.
      - ../../agent/belief:/app/agent/belief:ro
      - ../../agent/clock.py:/app/agent/clock.py:ro
      - ../../agent/execution:/app/agent/execution:ro
      - ../../agent/hash_named_graph.py:/app/agent/hash_named_graph.py:ro
      - ../../agent/history:/app/agent/history:ro
      - ../../agent/journal.py:/app/agent/journal.py:ro
      - ../../agent/lifecycle.py:/app/agent/lifecycle.py:ro
      - ../../agent/metrics:/app/agent/metrics:ro
      - ../../agent/ontology.py:/app/agent/ontology.py:ro
      - ../../agent/ontology.ttl:/app/agent/ontology.ttl:ro
      - ../../agent/planning:/app/agent/planning:ro
      - ../../agent/runtime.py:/app/agent/runtime.py:ro
      - ../../agent/series.dependencies.txt:/app/agent/series.dependencies.txt:ro
      - ../../agent/series.py:/app/agent/series.py:ro
      - ../../agent/stance.py:/app/agent/stance.py:ro
      - ../../agent/store.py:/app/agent/store.py:ro
      - ../../agent/transport/transport.py:/app/agent/transport/transport.py:ro
      - ../../agent/tree.py:/app/agent/tree.py:ro
      - ../../domains:/app/domains:ro

volumes:
  orexis-driver-dispatcher:
  orexis-driver-dispatcher-journal:
