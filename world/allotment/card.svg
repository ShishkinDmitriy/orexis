-anchor="middle" font-size="13" font-weight="700" fill="#23262b">supplier</text><g transform="translate(190,180) scale(1.2)"><ellipse cx="0" cy="26" rx="12" ry="3.5" fill="#000" opacity=".15"/><circle cx="0" cy="-16" r="9" fill="#f2c28b" stroke="#333" stroke-width="1.5"/><path d="M-9,-20 q9,-12 18,0 q-9,-4 -18,0 z" fill="#5a3b22"/><path d="M-11,10 q0,-18 11,-18 q11,0 11,18 z" fill="#b23a55"/><line x1="-5" y1="9" x2="-7" y2="25" stroke="#b23a55" stroke-width="5" stroke-linecap="round"/><line x1="5" y1="9" x2="8" y2="25" stroke="#b23a55" stroke-width="5" stroke-linecap="round"/></g><text x="190" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#8d1d35">rose grower</text><g transform="translate(770,180) scale(1.2)"><ellipse cx="0" cy="26" rx="12" ry="3.5" fill="#000" opacity=".15"/><circle cx="0" cy="-16" r="9" fill="#f2c28b" stroke="#333" stroke-width="1.5"/><path d="M-9,-20 q9,-12 18,0 q-9,-4 -18,0 z" fill="#5a3b22"/><path d="M-11,10 q0,-18 11,-18 q11,0 11,18 z" fill="#3f7b3a"/><line x1="-5" y1="9" x2="-7" y2="25" stroke="#3f7b3a" stroke-width="5" stroke-linecap="round"/><line x1="5" y1="9" x2="8" y2="25" stroke="#3f7b3a" stroke-width="5" stroke-linecap="round"/></g><text x="770" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#2f6b34">fern grower</text><path d="M408,94 l6,12 l8,-12 z" fill="#fff8e6" stroke="#cfd3d8"/><rect x="390" y="46" width="230" height="48" rx="10" fill="#fff8e6" stroke="#cfd3d8"/><rect x="409" y="92" width="12" height="3" fill="#fff8e6"/><text x="402" y="68" font-size="13" fill="#23262b">a round of water: ½ L a lot,</text><text x="402" y="87" font-size="13" fill="#23262b">reserve 1 / L, bids 30 s</text><path d="M78,89 l6,12 l8,-12 z" fill="#fdecef" stroke="#cfd3d8"/><rect x="60" y="60" width="168.0" height="29" rx="10" fill="#fdecef" stroke="#cfd3d8"/><rect x="79" y="87" width="12" height="3" fill="#fdecef"/><text x="72" y="82" font-size="13" fill="#23262b">tender: ½ L at 3 / L</text><path d="M718,89 l6,12 l8,-12 z" fill="#ecf6ea" stroke="#cfd3d8"/><rect x="700" y="60" width="168.0" height="29" rx="10" fill="#ecf6ea" stroke="#cfd3d8"/><rect x="719" y="87" width="12" height="3" fill="#ecf6ea"/><text x="712" y="82" font-size="13" fill="#23262b">tender: ½ L at 2 / L</text><path d="M250,98 C320,110 360,120 400,110" fill="none" stroke="#b23a55" stroke-width="2" stroke-dasharray="4 6"/><path d="M700,98 C640,110 600,120 560,110" fill="none" stroke="#3f7b3a" stroke-width="2" stroke-dasharray="4 6"/><text x="480" y="222" text-anchor="middle" font-size="12" fill="#6b6f76">clears pay-as-bid,</text><text x="480" y="238" text-anchor="middle" font-size="12" fill="#6b6f76">serves each claim presented</text></g><rect x="30" y="30" width="900" height="410" rx="18" fill="none" stroke="#e1ddd3"/><text x="30" y="492" font-size="30" font-weight="800" fill="#23262b">world/allotment<tspan dx="18" font-size="17" font-weight="400" fill="#6b6f76">two plots, one tap, and the tap is somebody else's</tspan></text><text x="30" y="524" font-size="16" fill="#23262b">Two growers watch their plots but hold no valve; the supplier sells its water a lot at a time, and each grower bids for what it needs.</text><rect x="30" y="544" width="71.2" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="65.6" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">3 agents</text><rect x="109.2" y="544" width="63.800000000000004" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="141.1" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">2 plots</text><rect x="181.0" y="544" width="197.0" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="279.5" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">valves are the supplier's</text><rect x="386.0" y="544" width="71.2" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="421.6" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">a market</text><rect x="465.2" y="544" width="197.0" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="563.7" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">desires, each agent's own</text><rect x="670.2" y="544" width="78.60000000000001" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="709.5" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">simulated</text></svg>