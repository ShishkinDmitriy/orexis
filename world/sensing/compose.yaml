# GENERATED by `orexis-compose sensing` from the world beside it — do not edit.
#
# The roster is the world. Add an agent there, regenerate, and it is deployed; there is no second
# list to keep in step. Run `orexis-mqtt sensing` first, then from this directory:
#
#   cd world/sensing && podman compose up -d
#   cd world/sensing && podman compose logs -f

name: orexis-sensing

# podman-compose puts every service in one pod by default, and a pod cannot combine with the
# per-service user-namespace mapping below. Ignored by docker compose.
x-podman:
  in_pod: false

services:

  mosquitto:
    build:
      context: ../../infra/mosquitto
      dockerfile: Containerfile
    image: orexis-mosquitto:local
    ports: ["1884:1884", "8884:8884"]
    restart: unless-stopped
    volumes:
      # generated by `orexis-mqtt sensing` from this world's wiring and its stated ports
      - ./mosquitto/orexis.conf:/etc/mosquitto/conf.d/orexis.conf:ro
      - ./mosquitto/passwd:/etc/mosquitto/passwd:ro
      - ./mosquitto/acl.conf:/etc/mosquitto/acl.conf:ro
      # Its authority is this world's own, so it trusts exactly one and never learns
      # that other worlds exist — the same rule the belief base already follows.
      - ./secrets/ca.crt:/etc/mosquitto/clients-ca.crt:ro
      - ./secrets/broker.crt:/etc/mosquitto/broker.crt:ro
      - ./secrets/broker.key:/etc/mosquitto/broker.key:ro
      # retained cadences outlive a restart: a sleeping board must still receive the interval
      # its agent set before the broker bounced
      - orexis-sensing-mosquitto:/var/lib/mosquitto

  agent-fern:
    image: orexis:local
    command: ["orexis-agent", "/app/world/sensing", "fern", "--volume", "/app/state"]
    environment:
      # where this world's broker listens — generated from the world, never read off it by the agent
      MQTT_HOST: "localhost"
      MQTT_PORT: "1884"
      MQTT_TLS_PORT: "8884"
      MQTT_CERT: "/app/secrets/agent.crt"
      MQTT_KEY: "/app/secrets/agent.key"
      MQTT_CA: "/app/secrets/ca.crt"
    env_file:
      # where the series store is, and the org — safe for every agent to hold
      - ../../infra/.env
      # its own bucket and a token that opens only it, minted by `orexis-influx sensing`, and its
      # own broker credential, minted by `orexis-mqtt sensing`; mounted into THIS container alone
      - ./secrets/influx-fern.env
      - ./secrets/mqtt-fern.env
    network_mode: host
    # Rootless podman maps YOUR uid into the container; map it onto the image's user so the agent
    # can write its own belief-base volume.
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: unless-stopped
    volumes:
      # its own belief base, and nobody else can name it
      - orexis-sensing-fern:/app/state
      # the world's documents, file by file, at the path its imports of the domains resolve from
      - ./hardware.ttl:/app/world/sensing/hardware.ttl:ro
      - ./world.ttl:/app/world/sensing/world.ttl:ro
      - ./secrets/fern.crt:/app/secrets/agent.crt:ro
      - ./secrets/fern.key:/app/secrets/agent.key:ro
      - ./secrets/ca.crt:/app/secrets/ca.crt:ro
      # The trees, mounted so a code change needs a restart rather than a rebuild — the SAME ones
      # the Containerfile copies, which `tests/test_layout.py` holds the two lists to.
      - ../../agent:/app/agent:ro
      - ../../domains:/app/domains:ro
      - ../../simulation:/app/simulation:ro
      - ../../assembly:/app/assembly:ro
      - ../../agent_old:/app/agent_old:ro
      - ../../packages:/app/packages:ro

volumes:
  orexis-sensing-mosquitto:
  orexis-sensing-fern:
