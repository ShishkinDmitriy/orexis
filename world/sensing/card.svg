62b"/><text x="537.8000000000001" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">board takes commands</text><rect x="625.8000000000001" y="544" width="63.800000000000004" height="26" rx="13" fill="#23262b" stroke="#23262b"/><text x="657.7" y="561.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#fff">indoors</text></svg>