# GENERATED by `orexis-compose layby` from the world beside it — do not edit.
#
# The roster is the world. Add an agent there, regenerate, and it is deployed; there is no second
# list to keep in step. Run `orexis-mqtt layby` first, then from this directory:
#
#   cd world/layby && podman compose up -d
#   cd world/layby && podman compose logs -f

name: orexis-layby

# podman-compose puts every service in one pod by default, and a pod cannot combine with the
# per-service user-namespace mapping below. Ignored by docker compose.
x-podman:
  in_pod: false

services:

  mosquitto-broker:
    build:
      context: ../../infra/mosquitto
      dockerfile: Containerfile
    image: orexis-mosquitto:local
    ports: ["1892:1892", "8892:8892"]
    restart: unless-stopped
    volumes:
      # generated by `orexis-mqtt layby` from this world's wiring and the ports it asserts or is allocated
      - ./mosquitto/broker/orexis.conf:/etc/mosquitto/conf.d/orexis.conf:ro
      - ./mosquitto/broker/passwd:/etc/mosquitto/passwd:ro
      - ./mosquitto/broker/acl.conf:/etc/mosquitto/acl.conf:ro
      # Its authority is this world's own, so it trusts exactly one and never learns
      # that other worlds exist — the same rule the belief base already follows.
      - ./secrets/ca.crt:/etc/mosquitto/clients-ca.crt:ro
      # and what that authority has revoked — empty where nobody is, and always mounted,
      # since the config names it and a crlfile that is absent refuses every agent
      - ./mosquitto/crl.pem:/etc/mosquitto/crl.pem:ro
      - ./secrets/broker.crt:/etc/mosquitto/broker.crt:ro
      - ./secrets/broker.key:/etc/mosquitto/broker.key:ro
      # retained cadences outlive a restart: a sleeping board must still receive the interval
      # its agent set before the broker bounced
      - orexis-layby-mosquitto-broker:/var/lib/mosquitto

  simulation:
    image: orexis-layby-simulation:local
    build:
      context: ../..
      dockerfile: simulation/Containerfile
    command: ["python", "-m", "simulation", "/app/world/layby"]
    environment:
      MQTT_HOST: "localhost"
      MQTT_PORT: "1892"
    env_file:
      # the credential of `simulation`, the client that hosts what the world says no one built
      - ./secrets/mqtt-simulation.env
    network_mode: host
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: unless-stopped
    volumes:
      - ./constraints.ttl:/app/world/layby/constraints.ttl:ro
      - ./society.derived.ttl:/app/world/layby/society.derived.ttl:ro
      - ./society.ttl:/app/world/layby/society.ttl:ro
      - ./world.ttl:/app/world/layby/world.ttl:ro
      - ../../orexis:/app/orexis:ro
      - ../../orexis-agent:/app/orexis-agent:ro
      - ../../orexis-belief:/app/orexis-belief:ro
      - ../../orexis-coordination:/app/orexis-coordination:ro
      - ../../orexis-execution:/app/orexis-execution:ro
      - ../../orexis-history:/app/orexis-history:ro
      - ../../orexis-metrics:/app/orexis-metrics:ro
      - ../../orexis-planning:/app/orexis-planning:ro
      - ../../orexis-prediction:/app/orexis-prediction:ro
      - ../../orexis-sensing:/app/orexis-sensing:ro
      - ../../orexis-span:/app/orexis-span:ro
      - ../../orexis-span-otlp:/app/orexis-span-otlp:ro
      - ../../orexis-speech:/app/orexis-speech:ro
      - ../../orexis-translation:/app/orexis-translation:ro
      - ../../orexis-transport-email:/app/orexis-transport-email:ro
      - ../../orexis-transport-http:/app/orexis-transport-http:ro
      - ../../orexis-transport-mqtt:/app/orexis-transport-mqtt:ro
      - ../../orexis-transport-telegram:/app/orexis-transport-telegram:ro
      - ../../documents:/app/documents:ro
      - ../../domains:/app/domains:ro
      - ../../simulation:/app/simulation:ro

  agent-courier_a:
    image: orexis-layby-courier_a:local
    build:
      context: ../..
      dockerfile: orexis-agent/Containerfile
      args:
        # the packages it runs, each a feature of the binary, and nothing else's
        FEATURES: "belief,execution,mqtt,planning,sensing,speech"
    command: ["orexis-agent", "/app/world/layby", "courier_a", "--volume", "/app/state", "--journal", "/app/journal"]
    environment:
      # each broker it is connected to and where that listens — asserted or allocated, generated here,
      # never read off the world by the agent
      MQTT_BROKERS: "http://example.org/orexis/world/layby#broker mqtts://localhost:8892"
      MQTT_CERT: "/app/world/layby/secrets/courier_a/agent.crt"
      MQTT_KEY: "/app/world/layby/secrets/courier_a/agent.key"
      MQTT_CA: "/app/secrets/ca.crt"
      # where each series it writes goes, and the org — the store the installation says serves each
      # purpose, its metrics only where the world is monitored — safe for every agent to hold
      INFLUX_HISTORY_URL: "http://localhost:8086"
      INFLUX_HISTORY_ORG: "orexis"
      # where it serves its journal, on the host's loopback, allocated by the installation
      JOURNAL_PORT: "7887"
    env_file:
      # its own bucket per purpose and a token that opens only it, minted by `orexis-influx layby`, and
      # its own broker credential, minted by `orexis-mqtt layby`; mounted into THIS container alone
      - ./secrets/courier_a/influx-history.env
      - ./secrets/courier_a/mqtt.env
    network_mode: host
    # Rootless podman maps YOUR uid into the container; map it onto the image's user so the agent
    # can write its own belief-base volume.
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: unless-stopped
    volumes:
      # its own belief base, and nobody else can name it
      - orexis-layby-courier_a:/app/state
      # its journal, a store of its own beside the beliefs and apart from them
      - orexis-layby-courier_a-journal:/app/journal
      # the world's documents, file by file, at the path its imports of the domains resolve from
      - ./constraints.ttl:/app/world/layby/constraints.ttl:ro
      - ./society.derived.ttl:/app/world/layby/society.derived.ttl:ro
      - ./society.ttl:/app/world/layby/society.ttl:ro
      - ./world.ttl:/app/world/layby/world.ttl:ro
      - ./beliefs/courier_a.desires.ttl:/app/world/layby/beliefs/courier_a.desires.ttl:ro
      - ./beliefs/courier_a.self.ttl:/app/world/layby/beliefs/courier_a.self.ttl:ro
      - ./beliefs/courier_a.state.ttl:/app/world/layby/beliefs/courier_a.state.ttl:ro
      # its own secrets, whole: its credentials, its certificate, and every document only it is handed — written
      # by onboarding and by hand, never committed, and mounted into THIS container alone
      - ./secrets/courier_a:/app/world/layby/secrets/courier_a:ro
      # the world's authority, which every client of its brokers trusts
      - ./secrets/ca.crt:/app/secrets/ca.crt:ro
      # The domains, mounted over the image's copy so a changed document needs a restart; the binary and the
      # tree's documents are its image's, so a change to the agent is a rebuild.
      - ../../domains:/app/domains:ro

volumes:
  orexis-layby-mosquitto-broker:
  orexis-layby-courier_a:
  orexis-layby-courier_a-journal:
