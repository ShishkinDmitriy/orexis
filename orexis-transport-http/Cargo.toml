# THE HTTP TRANSPORT: how an agent reaches a service over the web, in the words of the W3C Web of Things Thing
# Description — ported from `agent/transport/http/*.py` beside it, held to what its suite asks
# (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis-transport-http"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory.workspace = true
tokio.workspace = true
orexis = { workspace = true }
orexis-transport = { workspace = true }
oxsdatatypes = "0.2"
regex = "1"
# THE WEB, on the runtime the agent is, over rustls so the image needs no OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
log = "0.4"

[dev-dependencies]
orexis = { workspace = true, features = ["snapshots"] }
