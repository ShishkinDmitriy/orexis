; The OUTDOOR SENTINEL for Orexis — the third firmware: moisture-sentinel, copied, on a
; FireBeetle 2 ESP32-E with a BME280 beside the probe and the board's own WS2812 as the lamp.
; Everything the sentinel is — push mode, the ULP's movement watch, the heartbeat under the
; agent's freshness rule — is unchanged; see README.md for what the copy costs (#461).
;
; Build/flash:  pio run -t upload        Monitor:  pio device monitor

[env:firebeetle2_esp32e]
; PINNED to the pioarduino fork for Arduino 3.x / ESP-IDF 5.x. PlatformIO's own
; espressif32 platform still pins Arduino 2.0.17 (IDF 4.4), whose SDK has no ulp_adc
; driver — and the ULP's ADC does not survive deep sleep there. Four register-level
; fixes were tried and measured to fail (CKGEN_I2C_PU, the analog bias pair, SAR power,
; CK8M); the coprocessor itself runs fine in sleep, so the fault is I_ADC alone. IDF 5.x
; ships ulp_adc_init() to do exactly this setup, which is the reason for the move.
; The governed node (firmware/moisture-sensor) keeps its own platformio.ini and is
; untouched by this. The FireBeetle 2 ESP32-E is the same silicon as the DevKitC the
; sentinel was brought up on, so the pin and the ULP's ADC channel are unchanged.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    ; No ArduinoJson: a sentinel parses nothing, because it listens to nothing.
    ; The outdoor air sensor, behind #ifdef BME280_SDA_PIN — lib_deps cannot be conditional
    ; on a generated header, so it is listed here and compiled away if a world states none.
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
; DFRobot FireBeetle 2 ESP32-E (esp32:FireBeetle2Esp32E), CH340 serial — world/terrace
board = dfrobot_firebeetle2_esp32e
