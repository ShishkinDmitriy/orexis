; ESP32 soil-moisture SENTINEL for Orexis — the second firmware (#151).
;
; A sentinel takes no orders: sensing:PushProcedure, so its agent derives Listening and can
; only receive. It deep-sleeps while the ULP watches a band COMPILED IN from the world's own
; ranges, wakes to publish when the value crosses, and otherwise speaks once per heartbeat so
; silence stays distinguishable from death.
;
; Build/flash:  pio run -t upload        Monitor:  pio device monitor

[env:esp32dev]
; PINNED to the pioarduino fork for Arduino 3.x / ESP-IDF 5.x. PlatformIO's own
; espressif32 platform still pins Arduino 2.0.17 (IDF 4.4), whose SDK has no ulp_adc
; driver — and the ULP's ADC does not survive deep sleep there. Four register-level
; fixes were tried and measured to fail (CKGEN_I2C_PU, the analog bias pair, SAR power,
; CK8M); the coprocessor itself runs fine in sleep, so the fault is I_ADC alone. IDF 5.x
; ships ulp_adc_init() to do exactly this setup, which is the reason for the move.
; The governed node (firmware/moisture-sensor) keeps its own platformio.ini and is
; untouched by this.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    ; No ArduinoJson: a sentinel parses nothing, because it listens to nothing.
