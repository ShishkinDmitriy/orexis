; ESP32 pump/valve node for Agora — the actuation edge.
; Subscribes to executor commands over MQTT and drives a relay, with a fail-safe watchdog.
;
; Build/flash:  pio run -t upload        Monitor:  pio device monitor
; (change `board` if yours differs — esp32dev fits most DevKitC boards)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
