; ESP32 soil-moisture sensor node for Orexis.
; Reads a capacitive moisture sensor and publishes to MQTT for the gateway.
;
; Build/flash:  pio run -t upload        Monitor:  pio device monitor
; (change `board` if yours differs — esp32dev fits most DevKitC boards)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    ; Only used when the world says this board carries a temp/humidity sensor. Listed
    ; unconditionally because lib_deps cannot be conditional on a generated header — the code
    ; behind #ifdef AIR_SENSOR_PIN is what actually disappears on a board without one.
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
