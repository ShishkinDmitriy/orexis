; ESP32 soil-moisture sensor node for Agora.
; Reads a capacitive moisture sensor and publishes to MQTT for the gateway.
;
; Build/flash:  pio run -t upload        Monitor:  pio device monitor
; (change `board` if yours differs — esp32dev fits most DevKitC boards)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
