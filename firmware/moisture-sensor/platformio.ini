; ESP32 soil-moisture sensor node for Orexis.
; Reads a capacitive moisture sensor (and an air sensor, where the world says the board carries
; one) and publishes to MQTT for its agent.
;
; Build/flash:  pio run -e <env> -t upload        Monitor:  pio device monitor
;
; ONE firmware, per MODEL of node, and one environment per BOARD it has been put on. The world
; decides which board a given config.h is for (orexis-firmware <world>); pick the matching
; environment here. Both are the same silicon — an ESP32-E is an ESP32-D0WD-V3 — so the code,
; the ULP watcher and the pin rules are identical; what differs is what PlatformIO needs to
; know to talk to the board.

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
    ; Air-sensor drivers. Only ONE is used by any given build — the code behind
    ; #ifdef AIR_SENSOR_PIN (DHT11, one-wire) or #ifdef BME280_SDA_PIN (BME280, I2C) is what
    ; actually disappears on a board without that part — but lib_deps cannot be conditional on
    ; a generated header, so both are listed unconditionally.
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14

; world/sensing: ESP32 DevKitC (esp32:DevKitC). esp32dev fits most DevKitC boards.
[env:esp32dev]
board = esp32dev

; world/terrace: DFRobot FireBeetle 2 ESP32-E (esp32:FireBeetle2Esp32E), CH340 serial.
[env:firebeetle2_esp32e]
board = dfrobot_firebeetle2_esp32e
