# THE BINARY: one agent, booted from a world's files and run until nothing is left to pursue, each package a
# feature, so a package an agent does not run is compiled out
# (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis-agent"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "orexis-agent"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[features]
default = ["belief", "planning", "execution", "sensing", "prediction", "speech", "coordination", "mqtt"]
belief = ["dep:orexis-belief"]
planning = ["dep:orexis-planning"]
execution = ["dep:orexis-execution"]
sensing = ["dep:orexis-sensing"]
prediction = ["dep:orexis-prediction"]
mqtt = ["dep:orexis-mqtt"]
speech = ["dep:orexis-speech"]
coordination = ["dep:orexis-coordination"]
volume = ["orexis/volume"]

[dependencies]
orexis = { path = "../agent" }
orexis-belief = { path = "../agent/belief", optional = true }
orexis-planning = { path = "../agent/planning", optional = true }
orexis-execution = { path = "../agent/execution", optional = true }
orexis-sensing = { path = "../agent/sensing", optional = true }
orexis-prediction = { path = "../agent/prediction", optional = true }
orexis-mqtt = { path = "../agent/transport/mqtt", optional = true }
orexis-speech = { path = "../agent/speech", optional = true }
orexis-coordination = { path = "../agent/coordination", optional = true }
oxsdatatypes = "0.2"
log = "0.4"

[dev-dependencies]
serde_json = "1"
sha2 = "0.11"
