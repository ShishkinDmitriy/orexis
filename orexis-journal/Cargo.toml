# THE JOURNAL, KEPT: every event the agent's packages say and every activity they end, written to the agent's journal
# in memory as it happens. The half that does the work; orexis-journal-oxigraph archives what lasts and orexis-journal-otlp ships the activities.
[package]
name = "orexis-journal"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory.workspace = true
orexis = { workspace = true }
oxigraph.workspace = true
log = "0.4"
oxsdatatypes = "0.2"
tokio.workspace = true
tiny_http = { version = "0.12", optional = true }

[features]
# THE JOURNAL'S ENDPOINT, served read-only on the host's loopback: the binary's.
serve = ["dep:tiny_http"]
