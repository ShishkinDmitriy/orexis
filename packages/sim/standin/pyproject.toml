# orexis-sim-standin
#
# A package is a PROJECT: it declares what it needs, and nothing declares it on its behalf.
# The import name is `packages.sim.standin` and the distribution is `orexis-sim-standin` — one namespace,
# many distributions, which is what lets this directory be developed and installed on its own.
[project]
name = "orexis-sim-standin"
version = "0.1.0"
description = "A stand-in: something that plays a sensor's part without being one"
requires-python = ">=3.10"
dependencies = [
    "orexis",  # assembly (the manifest) and, where there is behaviour, the kernel
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `packages/` and `packages/sim/` are NAMESPACE portions (PEP 420) and are claimed by nobody,
# which is what lets twenty-one distributions share them. This project owns one leaf and says so.
packages = ["packages.sim.standin"]
package-dir = {"packages.sim.standin" = "."}

[tool.setuptools.package-data]
# The knowledge a package ships is not an afterthought to its Python — for most of them it IS
# the package. A wheel without these files installs a directory that contributes nothing.
"packages.sim.standin" = ["*.ttl", "*.ru", "*.rq"]
