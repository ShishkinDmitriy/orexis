# orexis-agent-planning
#
# The planning layer of Agent 2.0, and the successor of `orexis-agent-deliberation`. What it
# holds is the search: the wants derived from the desires, the imaginarium each scope of them
# is searched in, and the plan that comes back. It stands on the execution layer and nothing
# stands on it but the container that assembles an agent.
#
# The name is the activity, as its predecessor's was the faculty. `deliberation` was BDI's
# WHETHER and carried a deliberator, a reviser, a pursuit and a collection of what was being
# considered — the whole apparatus of deciding what to want. What is here is one question,
# asked directly: given these desires and these wants, what plan reaches one of them. See
# knowledge/decisions/an-agent-is-four-things.md.
[project]
name = "orexis-agent-planning"
version = "0.1.0"
description = "The planning layer — wants derived from desires, and a bounded search over the worlds each step would make"
requires-python = ">=3.10"
dependencies = [
    # `assembly` — the manifest contributes this layer's vocabulary by term, which is the
    # one thing here that reaches it.
    "orexis",
    # The layer beneath: the store the search reads, the ledger a plan is copied into, the act
    # it fills, the clock it stands at, and the shape compiler it judges a world with.
    "orexis-agent-execution",
    # The imaginarium is a store of its own, and a signature hashes quads.
    "pyoxigraph>=0.4",
    # A shape is walked with rdflib, because the compiler that turns one into a select walks
    # rdflib and the store has no shape API. The only reason it is here: there is no JUDGE in
    # this package — that belongs at the gates — so `pyrudof` is not a dependency of planning.
    "rdflib>=7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orexis_agent_planning"]
package-dir = {"orexis_agent_planning" = "."}
