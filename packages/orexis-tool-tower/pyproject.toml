# orexis-tool-tower
#
# A package is a PROJECT, and its DIRECTORY IS ITS NAME. The family is the second segment —
# `tool` — stated here and nowhere else. Knowledge-only: a bridge between two planning
# domains is an axiom, a translation and an estimate, and needs no Python.
[project]
name = "orexis-tool-tower"
version = "0.1.0"
description = "Hanoi's disks on the courier's grid — the bridge that lets a Move be planned as drives"
requires-python = ">=3.10"
dependencies = [
    "orexis",  # assembly (the manifest)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orexis_tool_tower"]
package-dir = {"orexis_tool_tower" = "."}

[tool.setuptools.package-data]
"orexis_tool_tower" = ["*.ttl", "*.ru", "*.rq"]
