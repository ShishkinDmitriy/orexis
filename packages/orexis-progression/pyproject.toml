# orexis-progression
#
# The progression layer of the kernel: the ledger, the patience, the verification watch, the
# timer and the doing half of execution (a-layer-is-a-package-and-need-loads-it, #452). It
# stands on the reactive loop — every timer of the society lands there through this package —
# and on the mind's stores, and it never imports the search above it. Two segments,
# `orexis-<layer>`, because a layer is one package and not a family with members.
[project]
name = "orexis-progression"
version = "0.1.0"
description = "The progression layer — the store engine, the intention ledger, its patience, the scheduler and the road from a committed act to its actor"
requires-python = ">=3.10"
dependencies = [
    # `assembly` — the store reads every package's namespaces off the loader, and the keeper
    # contributes `reports` to the choir by term. The root ships it: a knowing metadata cycle
    # with the root (whose agent/ imports this package back), belonging to the shared
    # distribution rather than to the layering — the imports themselves are acyclic.
    "orexis",
    # The layer beneath: the loop a timer lands on and an act is taken on.
    "orexis-reactive",
    # The store engine is this layer's — the lowest that persists anything.
    "pyoxigraph>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orexis_progression"]
package-dir = {"orexis_progression" = "."}
