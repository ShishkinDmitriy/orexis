# orexis-transport-mqtt
#
# A package is a PROJECT, and its DIRECTORY IS ITS NAME. This directory, this
# distribution and the module `orexis_transport_mqtt` are one string in three spellings, so a
# package cannot be filed under one family and published under another. The family
# is the second segment — `transport` — and it is stated here and nowhere else.
[project]
name = "orexis-transport-mqtt"
version = "0.1.0"
description = "MQTT — how a device is reached, and how an agent reaches its society"
requires-python = ">=3.10"
dependencies = [
    "orexis",  # assembly (the manifest) and, where there is behaviour, the kernel
    "orexis-progression",  # Timer, and tree_bytes off upkeep — progression's contract
    "paho-mqtt>=2.0",  # driver.py speaks the protocol
    "orexis-capability-sensing",  # Codec, Scaling, pointer — the contracts it implements
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# A TOP-LEVEL module, claimed by this distribution alone. There is no shared import root to
# join and none to shut anybody out of: what used to be `packages.<family>.<name>` under a
# namespace three distributions had to cooperate over is now one name owned by one project.
packages = ["orexis_transport_mqtt"]
package-dir = {"orexis_transport_mqtt" = "."}

[tool.setuptools.package-data]
# The knowledge a package ships is not an afterthought to its Python — for most of them it IS
# the package. A wheel without these files installs a module that contributes nothing.
"orexis_transport_mqtt" = ["*.ttl", "*.ru", "*.rq"]
