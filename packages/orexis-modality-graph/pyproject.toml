# orexis-modality-graph
#
# The mind's stores, held as graphs — the FLOOR of the layered kernel
# (a-layer-is-a-package-and-need-loads-it, #451). The layers mostly do not call each other;
# they meet at the belief base, which is why this package sits beneath them all: it imports
# `assembly` and nothing above itself, and the layers import it — the one ordinary downward
# import, a layer reaching the contract of the layer below. The family is `modality` because
# knowledge/domain/modality.md owns the word for what this holds; the member is `graph`
# because THIS way of having the family is named RDF graphs in an embedded store, and a
# member that held them differently would be its sibling.
[project]
name = "orexis-modality-graph"
version = "0.1.0"
description = "The mind's stores as named RDF graphs — the modalities every layer meets at, importing no layer"
requires-python = ">=3.10"
dependencies = [
    # `assembly` — the store reads every package's namespaces off the loader and the desire
    # modality collects the packages' desires.ru; assembly is beneath this package exactly as
    # this package is beneath the layers. `assembly` ships in the root distribution, which is
    # why the arrow points at `orexis` — a knowing metadata CYCLE with the root (whose agent/
    # imports this package back), belonging to the shared distribution rather than to the
    # layering: the imports themselves are acyclic, assembly < the stores < the layers. It
    # dissolves the day assembly is a distribution of its own (#452's seam), and it is why the
    # Containerfile installs the two editables in one pip call.
    "orexis",
    "pyoxigraph>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# A TOP-LEVEL module, claimed by this distribution alone, exactly as every package claims its
# own: directory, distribution and module are one string in three spellings.
packages = ["orexis_modality_graph"]
package-dir = {"orexis_modality_graph" = "."}
