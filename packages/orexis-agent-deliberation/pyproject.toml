# orexis-agent-deliberation
#
# The deliberation layer of the kernel: the search, the imaginarium it searches in, the
# deliberator that asks it, the reviser that wakes it and the pursuit that commits what it
# finds (a-layer-is-a-package-and-need-loads-it, #452). It stands on progression and on the
# mind's stores, and nothing stands on it but the container that assembles an agent and the
# capabilities that knock on its doors. Named `orexis-agent-<layer>`: the family groups the
# three in a listing, and a layer is one package and not a family with members.
[project]
name = "orexis-agent-deliberation"
version = "0.1.0"
description = "The deliberation layer — the belief base, the desires, and BDI's whether by a bounded search over the worlds each lever would make"
requires-python = ">=3.10"
dependencies = [
    # `assembly` — the deliberator contributes `series` to the choir by term, and the planner
    # asks the loader for the packages' shapes.
    "orexis",
    # The layer beneath: the ledger a plan's head is committed to, the act it fills, the timer
    # its clock keeps, and the road a committed act is handed down.
    "orexis-agent-progression",
    # The reactive loop, for one thing: a plan's head crosses onto it to be committed and taken.
    "orexis-agent-reactive",
    # The imaginarium is a store of its own, and a signature hashes quads.
    "pyoxigraph>=0.4",
    # The judge: SHACL in Rust, behind judge.py — the one door, gaps closed there.
    "pyrudof>=0.3.16",
    # Effects are applied to an rdflib graph before they are written back, and the judge's
    # report crosses back as one; the judging itself is rudof, behind judge.py.
    "rdflib>=7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orexis_agent_deliberation"]
package-dir = {"orexis_agent_deliberation" = "."}
