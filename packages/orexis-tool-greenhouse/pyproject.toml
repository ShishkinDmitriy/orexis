# orexis-tool-greenhouse
#
# A package is a PROJECT, and its DIRECTORY IS ITS NAME. The family is the second segment —
# `tool` — stated here and nowhere else. Knowledge-only, like hanoi and the courier: this one
# adds one way of acting, a heater, so that a world can hold a want about two properties at
# once and the search can be measured on it.
[project]
name = "orexis-tool-greenhouse"
version = "0.1.0"
description = "A heated bed — the domain whose one want spans two properties, with a knob that couples them"
requires-python = ">=3.10"
dependencies = [
    "orexis",  # assembly (the manifest)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orexis_tool_greenhouse"]
package-dir = {"orexis_tool_greenhouse" = "."}

[tool.setuptools.package-data]
"orexis_tool_greenhouse" = ["*.ttl", "*.ru", "*.rq"]
