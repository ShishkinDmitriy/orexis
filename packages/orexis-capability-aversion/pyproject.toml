# orexis-capability-aversion
#
# A package is a PROJECT, and its DIRECTORY IS ITS NAME — this directory, this distribution
# and the module `orexis_capability_aversion` are one string in three spellings. The family
# is the second segment — `capability` — stated here and nowhere else.
[project]
name = "orexis-capability-aversion"
version = "0.1.0"
description = "A want met by absence — steering clear of the states a world ratifies as avoided"
requires-python = ">=3.10"
dependencies = [
    "orexis",  # assembly (the manifest) and the kernel's Module contract
    "orexis-agent-progression",  # the store engine and the kernel vocabulary — progression's contract
    "orexis-agent-deliberation",  # the Desire type — deliberation's contract
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orexis_capability_aversion"]
package-dir = {"orexis_capability_aversion" = "."}

[tool.setuptools.package-data]
"orexis_capability_aversion" = ["*.ttl", "*.ru", "*.rq"]
