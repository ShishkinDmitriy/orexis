# orexis-transport-mqtt
#
# A package is a PROJECT: it declares what it needs, and nothing declares it on its behalf.
# The import name is `packages.transport.mqtt` and the distribution is `orexis-transport-mqtt` — one namespace,
# many distributions, which is what lets this directory be developed and installed on its own.
[project]
name = "orexis-transport-mqtt"
version = "0.1.0"
description = "MQTT — how a device is reached, and how an agent reaches its society"
requires-python = ">=3.10"
dependencies = [
    "orexis",  # assembly (the manifest) and, where there is behaviour, the kernel
    "paho-mqtt>=2.0",  # driver.py speaks the protocol
    "orexis-capability-sensing",  # Codec, Scaling, pointer — the contracts it implements
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `packages/` and `packages/transport/` are NAMESPACE portions (PEP 420) and are claimed by nobody,
# which is what lets twenty-one distributions share them. This project owns one leaf and says so.
packages = ["packages.transport.mqtt"]
package-dir = {"packages.transport.mqtt" = "."}

[tool.setuptools.package-data]
# The knowledge a package ships is not an afterthought to its Python — for most of them it IS
# the package. A wheel without these files installs a directory that contributes nothing.
"packages.transport.mqtt" = ["*.ttl", "*.ru", "*.rq"]
