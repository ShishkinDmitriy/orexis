# orexis-tool-courier
#
# A package is a PROJECT, and its DIRECTORY IS ITS NAME. The family is the second segment —
# `tool` — stated here and nowhere else. Knowledge-only, like the other tool: a planning
# domain is an ontology and its actions, and this one exists to give the search something it
# can be measurably nearer to.
[project]
name = "orexis-tool-courier"
version = "0.1.0"
description = "A courier on a grid — the domain whose distance is a number, and whose pick genuinely deletes"
requires-python = ">=3.10"
dependencies = [
    "orexis",  # assembly (the manifest)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orexis_tool_courier"]
package-dir = {"orexis_tool_courier" = "."}

[tool.setuptools.package-data]
"orexis_tool_courier" = ["*.ttl", "*.ru", "*.rq"]
