# orexis-capability-reporting
#
# A package is a PROJECT: it declares what it needs, and nothing declares it on its behalf.
# The import name is `packages.capability.reporting` and the distribution is `orexis-capability-reporting` — one namespace,
# many distributions, which is what lets this directory be developed and installed on its own.
[project]
name = "orexis-capability-reporting"
version = "0.1.0"
description = "Telemetry: what an agent observed, written to the shared series store"
requires-python = ">=3.10"
dependencies = [
    "orexis",  # assembly (the manifest) and, where there is behaviour, the kernel
    "influxdb-client>=1.40",  # series.py writes points
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# `packages/` and `packages/capability/` are NAMESPACE portions (PEP 420) and are claimed by nobody,
# which is what lets twenty-one distributions share them. This project owns one leaf and says so.
packages = ["packages.capability.reporting"]
package-dir = {"packages.capability.reporting" = "."}

[tool.setuptools.package-data]
# The knowledge a package ships is not an afterthought to its Python — for most of them it IS
# the package. A wheel without these files installs a directory that contributes nothing.
"packages.capability.reporting" = ["*.ttl", "*.ru", "*.rq"]
