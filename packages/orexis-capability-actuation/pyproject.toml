# orexis-capability-actuation
#
# A package is a PROJECT, and its DIRECTORY IS ITS NAME. This directory, this
# distribution and the module `orexis_capability_actuation` are one string in three spellings, so a
# package cannot be filed under one family and published under another. The family
# is the second segment — `capability` — and it is stated here and nowhere else.
[project]
name = "orexis-capability-actuation"
version = "0.1.0"
description = "Acting on the world: a dose sized from a reading, and the valve it is commanded through"
requires-python = ">=3.10"
dependencies = [
    "orexis",  # assembly (the manifest) and, where there is behaviour, the kernel
    "orexis-agent-progression",  # Timer, Act, Commitment, and take_standing — progression's contract
    "orexis-agent-deliberation",  # effects and the reviser's door — deliberation's contract
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# A TOP-LEVEL module, claimed by this distribution alone. There is no shared import root to
# join and none to shut anybody out of: what used to be `packages.<family>.<name>` under a
# namespace three distributions had to cooperate over is now one name owned by one project.
packages = ["orexis_capability_actuation"]
package-dir = {"orexis_capability_actuation" = "."}

[tool.setuptools.package-data]
# The knowledge a package ships is not an afterthought to its Python — for most of them it IS
# the package. A wheel without these files installs a module that contributes nothing.
"orexis_capability_actuation" = ["*.ttl", "*.ru", "*.rq"]
