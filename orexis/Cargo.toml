# THE KERNEL: what packages meet at — the store over Oxigraph, the catalogue, the binder, the clock — ported
# from `agent/*.py` beside it (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
similar = { version = "2", optional = true }
oxigraph.workspace = true
oxsdatatypes = "0.2"
regex = "1"
sha2 = "0.11"
log = "0.4"
lru = "0.19"
tokio.workspace = true
inventory.workspace = true
spargebra = "0.4"
ureq = { version = "2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
similar = "2"

[features]
# THE SNAPSHOT RUNNER, for a package crate's tests: a case's `.trig` and `.diff` read as the Python suite reads them.
snapshots = ["dep:similar"]
# A VOLUME: the store on disk, RocksDB as pyoxigraph keeps it, so an agent moving from the Python kernel keeps its
# volume. The binary's alone: a package's tests run in memory.
volume = ["oxigraph/rocksdb"]
# THE SERIES' CLIENT, InfluxDB's write over HTTP: the binary's.
series = ["dep:ureq"]
