# THE MQTT TRANSPORT: how an agent's sensors reach it over a broker, and its commands reach its devices, in
# MQTT4SSN's words — ported from `agent/transport/mqtt/*.py` beside it, held to what its suite asks
# (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis-transport-mqtt"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory.workspace = true
tokio.workspace = true
orexis = { workspace = true }
orexis-sensing = { workspace = true }
orexis-speech = { workspace = true }
oxigraph.workspace = true
oxsdatatypes = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
rumqttc = "0.24"
log = "0.4"

[dev-dependencies]
orexis = { workspace = true, features = ["snapshots"] }
