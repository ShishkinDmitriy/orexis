<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1f2328; --muted: #6a717b; --rule: #e3e1dc; --cell: #f1efea;
  --asked: #2f6fd6; --said: #d9822b; --foreseen: #c9402f; --plan: #2f6fd6; --seen: #59606a; --conflict: #c9402f;
  --now: #fff3c4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1d2024; --ink: #e8e6e3; --muted: #9aa1aa; --rule: #30343a; --cell: #262a30;
    --asked: #6ea0ff; --said: #f0a456; --foreseen: #ff7a68; --plan: #6ea0ff; --seen: #b3b9c2; --conflict: #ff7a68;
    --now: #3a3420;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--rule); padding: 12px 16px; }
h1 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar input[type=range] { flex: 1 1 240px; min-width: 160px; }
button { font: inherit; padding: 4px 10px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; }
.instant { font-variant-numeric: tabular-nums; color: var(--muted); }
main { padding: 16px; display: grid; gap: 20px; }
h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
.row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.pane { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; min-width: 0; }
.pane h3 { font-size: 13px; margin: 0 0 6px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.pane h3 span { font-weight: 400; color: var(--conflict); font-size: 12px; text-align: right; }
svg { width: 100%; height: auto; display: block; }
svg text { font: 10px system-ui, sans-serif; fill: var(--ink); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.legend i { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 4px; border-radius: 2px; }
.log { max-height: 320px; overflow: auto; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 0; list-style: none; }
.log li { padding: 1px 4px; border-radius: 3px; white-space: pre-wrap; word-break: break-word; }
.log li.now { background: var(--now); }
.log li time { color: var(--muted); margin-right: 6px; }
.empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>__TITLE__</h1>
  <div class="bar">
    <button id="play" type="button">Play</button>
    <button id="back" type="button" aria-label="previous instant">◀</button>
    <button id="next" type="button" aria-label="next instant">▶</button>
    <input id="at" type="range" min="0" value="0" aria-label="instant">
    <span class="instant" id="when"></span>
  </div>
</header>
<main id="main"></main>
<script id="replay" type="application/json">__DATA__</script>
<script>
const R = JSON.parse(document.getElementById("replay").textContent);
const main = document.getElementById("main"), at = document.getElementById("at"), when = document.getElementById("when");
const NS = "http://www.w3.org/2000/svg", CELL = 28;
at.max = Math.max(0, R.instants.length - 1);

function el(tag, attrs, parent, text) {
  const e = tag.includes(":") || ["svg", "rect", "circle", "text", "line", "g", "polyline", "title"].includes(tag)
    ? document.createElementNS(NS, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
//  A COLOUR PER THING, the same in every pane and at every instant: each name a view places, in order, from one palette.
const PALETTE = ["#8e44ad", "#1f9e89", "#e8590c", "#3a86ff", "#c2255c", "#5c940d", "#b08900", "#495057"];
const things = [...new Set(R.grids.flatMap(g => Object.values(g.frames).flat().flatMap(f => [...(f.fixed || []), ...(f.seen || [])])
  .filter(c => !c.sample || c.name !== c.sample).map(c => c.name)))].sort();
function hue(name) { const i = things.indexOf(name); return i < 0 ? "var(--seen)" : PALETTE[i % PALETTE.length]; }
function clock(i) { const t = R.instants[i]; return t ? t.replace("T", " ").replace(/\+00:00$/, "Z") : ""; }

const grids = R.grids.map(g => {
  const section = el("section", {}, main);
  el("h2", {}, section, g.label);
  const legend = el("div", {class: "legend"}, section);
  for (const [name, colour, how] of [["fixed", "var(--ink)", "50%"], ["seen", "var(--seen)", "2px"], ["planned", "var(--plan)", "50%"],
                                     ["asked", "var(--asked)", "2px"], ["said", "var(--said)", "2px"], ["foreseen", "var(--foreseen)", "2px"]]) {
    const s = el("span", {}, legend); el("i", {style: `background:${colour};border-radius:${how};opacity:.8`}, s); s.append(name);
  }
  const row = el("div", {class: "row"}, section);
  const [x0, y0, x1, y1] = g.box, pad = 1;
  const w = (x1 - x0 + 1 + 2 * pad) * CELL, h = (y1 - y0 + 1 + 2 * pad) * CELL;
  const panes = R.agents.map(agent => {
    const pane = el("div", {class: "pane"}, row);
    const head = el("h3", {}, pane, agent); const badge = el("span", {}, head);
    const svg = el("svg", {viewBox: `0 0 ${w} ${h}`, role: "img", "aria-label": `${g.label} as ${agent} has it`}, pane);
    return {agent, svg, badge};
  });
  return {g, panes, X: x => (x - x0 + pad) * CELL, Y: y => (y - y0 + pad) * CELL, w, h};
});

const logs = R.agents.map(agent => {
  const pane = el("section", {class: "pane"}, main);
  el("h3", {}, pane, `${agent} — what it did`);
  const list = el("ol", {class: "log"}, pane);
  const items = (R.log[agent] || []).map(([i, text]) => {
    const li = el("li", {}, list); el("time", {}, li, clock(i).slice(11, 19)); li.append(text); li.dataset.i = i; return li;
  });
  if (!items.length) el("li", {class: "empty"}, list, "nothing recorded");
  return {list, items};
});

function draw(i) {
  at.value = i; when.textContent = `${clock(i)}  (${i + 1} of ${R.instants.length})`;
  for (const {g, panes, X, Y, w, h} of grids) {
    const [x0, y0, x1, y1] = g.box;
    for (const {agent, svg, badge} of panes) {
      svg.replaceChildren();
      const f = g.frames[agent][i] || {};
      for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++)
        el("rect", {x: X(x) + 1, y: Y(y) + 1, width: CELL - 2, height: CELL - 2, rx: 3, fill: "var(--cell)"}, svg);
      for (let x = x0; x <= x1; x++) el("text", {x: X(x) + CELL / 2, y: CELL * 0.7, "text-anchor": "middle", fill: "var(--muted)"}, svg, x);
      for (let y = y0; y <= y1; y++) el("text", {x: CELL * 0.5, y: Y(y) + CELL * 0.62, "text-anchor": "middle"}, svg, y);
      const cell = (c, colour, opacity, dash) => el("rect", {x: X(c.x) + 3, y: Y(c.y) + 3, width: CELL - 6, height: CELL - 6, rx: 3,
        fill: colour, "fill-opacity": opacity, stroke: colour, "stroke-dasharray": dash || "", "stroke-width": 1.5});
      for (const c of f.foreseen || []) { const r = cell(c, "var(--foreseen)", c.now ? .28 : .1, "3 2"); svg.appendChild(r); el("title", {}, r, `foreseen: ${c.name}`); }
      for (const c of f.said || []) { const r = cell(c, "var(--said)", c.now ? .4 : .14, c.taken ? "" : "4 2"); svg.appendChild(r); el("title", {}, r, `said by ${c.peer}: ${c.name}`); }
      for (const c of f.asked || []) { const r = cell(c, "var(--asked)", c.now ? .25 : .08); svg.appendChild(r); el("title", {}, r, `asked with: ${c.name}`); }
      const planned = (f.planned || []).slice().sort((a, b) => a.order - b.order);
      if (planned.length) el("polyline", {points: planned.map(c => `${X(c.x) + CELL / 2},${Y(c.y) + CELL / 2}`).join(" "),
        fill: "none", stroke: "var(--plan)", "stroke-width": 1.5, "stroke-opacity": .6}, svg);
      for (const c of planned) el("circle", {cx: X(c.x) + CELL / 2, cy: Y(c.y) + CELL / 2, r: 3, fill: "var(--plan)"}, svg);
      for (const c of f.flight || []) el("rect", {x: X(c.x) + 1, y: Y(c.y) + 1, width: CELL - 2, height: CELL - 2, rx: 4, fill: "none",
        stroke: "var(--plan)", "stroke-width": 2}, svg);
      for (const c of f.seen || []) {
        const r = el("rect", {x: X(c.x) + 6, y: Y(c.y) + 6, width: CELL - 12, height: CELL - 12, rx: 2, fill: "none",
          stroke: c.name === c.sample ? "var(--seen)" : hue(c.name), "stroke-width": 2}, svg);
        el("title", {}, r, `seen: ${c.name}${c.name === c.sample ? "" : " (as " + c.sample + ")"}`);
      }
      for (const c of f.fixed || []) {
        const r = el("circle", {cx: X(c.x) + CELL / 2, cy: Y(c.y) + CELL / 2, r: CELL / 3, fill: hue(c.name)}, svg);
        el("title", {}, r, `fixed: ${c.name}`);
        el("text", {x: X(c.x) + CELL / 2, y: Y(c.y) + CELL - 1, "text-anchor": "middle", style: "font-size:7px"}, svg, c.name);
      }
      badge.textContent = (f.conflicts || []).filter(c => c.standing).map(c =>
        `conflict with ${c.peer}${c.silent ? ", silent" : ""}, round ${c.round}${c.won_by ? ", won by " + c.won_by : ""}`).join("; ");
    }
  }
  for (const {list, items} of logs) {
    let last = null;
    for (const li of items) { const now = +li.dataset.i === i; li.classList.toggle("now", now); li.hidden = +li.dataset.i > i; if (now && !last) last = li; }
    if (last) list.scrollTop = last.offsetTop - list.offsetTop - 40;
  }
}

let timer = null;
document.getElementById("play").onclick = e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = "Play"; return; }
  if (+at.value >= +at.max) draw(0);
  e.target.textContent = "Pause";
  timer = setInterval(() => { if (+at.value >= +at.max) { document.getElementById("play").click(); return; } draw(+at.value + 1); }, 500);
};
document.getElementById("back").onclick = () => draw(Math.max(0, +at.value - 1));
document.getElementById("next").onclick = () => draw(Math.min(+at.max, +at.value + 1));
at.oninput = () => draw(+at.value);
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") document.getElementById("next").click(); if (e.key === "ArrowLeft") document.getElementById("back").click(); });
if (!R.instants.length) main.append("This history holds nothing to replay."); else draw(0);
</script>
</body>
</html>
