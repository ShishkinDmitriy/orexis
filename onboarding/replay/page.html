<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1f2328; --muted: #6a717b; --rule: #e3e1dc; --cell: #f1efea;
  --asked: #2f6fd6; --said: #d9822b; --foreseen: #c9402f; --plan: #2f6fd6; --seen: #59606a; --conflict: #c9402f;
  --now: #fff3c4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15171a; --panel: #1d2024; --ink: #e8e6e3; --muted: #9aa1aa; --rule: #30343a; --cell: #262a30;
    --asked: #6ea0ff; --said: #f0a456; --foreseen: #ff7a68; --plan: #6ea0ff; --seen: #b3b9c2; --conflict: #ff7a68;
    --now: #3a3420;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--rule); padding: 12px 16px; }
h1 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar input[type=range] { flex: 1 1 240px; min-width: 160px; }
button { font: inherit; padding: 4px 10px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); border-radius: 6px; cursor: pointer; }
.instant { font-variant-numeric: tabular-nums; color: var(--muted); }
main { padding: 16px; display: grid; gap: 20px; }
h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
.row { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.pane { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; min-width: 0; }
.pane h3 { font-size: 13px; margin: 0 0 6px; font-weight: 600; }
svg { width: 100%; height: auto; display: block; }
svg text { font: 10px system-ui, sans-serif; fill: var(--ink); }
.log { max-height: 320px; overflow: auto; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 0; list-style: none; }
.log li { padding: 1px 4px; border-radius: 3px; white-space: pre-wrap; word-break: break-word; }
.log li.now { background: var(--now); }
.log li time { color: var(--muted); margin-right: 6px; }
.empty { color: var(--muted); }
.agents { margin-top: 8px; align-items: flex-start; }
.agents input[type=text], h3 input[type=text] { font: inherit; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 76px; overflow: auto; flex: 1 1 100%; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border: 1px solid var(--rule); border-radius: 12px; cursor: pointer; font-size: 12px; color: var(--muted); }
.chip.on { color: var(--ink); background: var(--panel); }
.chip input { display: none; }
i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.pane h3 { display: flex; align-items: center; gap: 8px; }
.pane h3 input { margin-left: auto; font-weight: 400; }
.scene svg { max-width: 760px; max-height: 70vh; margin: 0 auto; }
.status { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; }
.status li { padding: 1px 0; }
</style>
</head>
<body>
<div id="replay"></div>
<script id="data" type="application/json">__DATA__</script>
<script>__SCRIPT__</script>
</body>
</html>
