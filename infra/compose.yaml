name: agora

# Infra for v1: the series (Influx) and Grafana for eyeballing it.
#
#   cd infra && podman compose up -d
#
# `compose.yaml` is the Compose Specification's own filename, so no -f is needed — the same
# invocation as a world (`cd world/<name> && podman compose up -d`). Compose reads `.env` from
# the directory holding the compose file, and the repo's one lives at the root, hence the
# symlink beside this file.
#
# There is no triplestore. Each agent holds its own belief base inside its own container —
# see knowledge/decisions/where-the-belief-base-lives.md — so the only shared infrastructure
# left is the history and the view of it. All images have arm64 builds, so this runs on
# the Raspberry Pi as-is.
#
# The broker is here too, built from infra/mosquitto/Containerfile. It is a custom image for
# one reason, recorded there: the official Alpine image cannot read a config file on this host
# by ANY means — bind mount, baked layer, or a file it writes itself — while a Debian build of
# the same package works first try. Without a config mosquitto binds localhost only, so the
# boards would never reach it.

services:
  influxdb:
    # PINNED, and now load-bearing: docker.io's `latest` points at InfluxDB 3 Core, whose
    # tokens are admin-only — fine-grained per-database tokens are an Enterprise feature. An
    # accidental upgrade would therefore not just change the query language, it would remove
    # the mechanism per-agent isolation is built on. See
    # knowledge/decisions/series-and-bus-isolation.md.
    image: docker.io/library/influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-agora}
      # The org must be born holding something, and this is NOT where readings go: every agent
      # writes to a bucket of its own, minted by `agora-influx`. This one exists so setup mode
      # has an answer, and stays empty.
      DOCKER_INFLUXDB_INIT_BUCKET: genesis
    # The admin username, password and token — the only credential that opens every bucket.
    # Delivered as a file rather than interpolated from `.env` because `.env` is handed to
    # every agent container, and this must not be.
    env_file: [./secrets/admin.env]
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    build:
      context: ./mosquitto
      dockerfile: Containerfile
    image: agora-mosquitto:local
    ports: ["1883:1883"]
    volumes:
      # retained messages survive a restart — a board that is asleep must still receive the
      # cadence its agent set before the broker bounced
      # /var/lib/mosquitto is where the DEBIAN package persists — the Alpine image's
      # /mosquitto/data would silently mount nothing and lose every retained cadence
      - mosquitto-data:/var/lib/mosquitto
      # Who may connect, and what each may say or hear. GENERATED by `agora-mqtt` from the
      # worlds' own wiring, so they are mounted rather than baked into the image — they change
      # whenever a world does. RUN `agora-mqtt <world>` BEFORE bringing this up: if the files
      # are absent, podman creates directories in their place and mosquitto will not start.
      # Mounted DIRECTLY in /etc/mosquitto and not in a subdirectory of it — see the
      # Containerfile. The host's AppArmor profile grants `/etc/mosquitto/*`, one level and no
      # deeper, so `/etc/mosquitto/agora/passwd` is refused however correct its permissions are.
      - ./mosquitto/passwd:/etc/mosquitto/passwd:ro
      - ./mosquitto/acl.conf:/etc/mosquitto/acl.conf:ro
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    # Its admin password, and the Influx admin token its datasource interpolates. Grafana is
    # the one reader that legitimately spans every agent's bucket: it is the operator's view
    # of the society, not a member's view of its neighbours.
    env_file: [./secrets/admin.env]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on: [influxdb]

volumes:
  mosquitto-data:
  influxdb-data:
  grafana-data:
