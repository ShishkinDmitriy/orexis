name: agora

# Infra for v1: the series (Influx) and Grafana for eyeballing it.
#
#   cd infra && podman compose up -d
#
# `compose.yaml` is the Compose Specification's own filename, so no -f is needed — the same
# invocation as a world (`cd world/<name> && podman compose up -d`). Compose reads `.env` from
# the directory holding the compose file, and the repo's one lives at the root, hence the
# symlink beside this file.
#
# There is no triplestore. Each agent holds its own belief base inside its own container —
# see knowledge/decisions/where-the-belief-base-lives.md — so the only shared infrastructure
# left is the history and the view of it. All images have arm64 builds, so this runs on
# the Raspberry Pi as-is.
#
# MQTT is NOT here: the Alpine/musl mosquitto image can't open a config file on this
# Pi's kernel (rootless overlay), so the broker runs on the host instead (apt install
# mosquitto — a glibc build). See README. The gateway/agents are host processes too,
# so a host broker is architecturally consistent.

services:
  influxdb:
    image: docker.io/library/influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-admin12345}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-agora}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-sensors}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dev-token-change-me}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: docker.io/grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on: [influxdb]

volumes:
  influxdb-data:
  grafana-data:
