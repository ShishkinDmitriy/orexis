apiVersion: 1

# Loads dashboard JSON files from a mounted folder on startup.
providers:
  - name: agora
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      # one directory per world, generated by `agora-dashboards <world>` — so Grafana
      # shows a folder per society, and a world removed from disk stops having one.
      foldersFromFilesStructure: true
