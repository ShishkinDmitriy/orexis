apiVersion: 1

# Auto-wires Grafana to InfluxDB (Flux).
#
# The token is interpolated from the environment (infra/secrets/admin.env) rather than written
# here, and it is deliberately the ADMIN one: with a bucket per agent, the only reader that
# still spans the whole society is the operator's dashboard.
#
# `defaultBucket` is now a starting point, not where the data is — every agent writes to its
# own bucket, named <world>-<agent> by `orexis-influx`. Panels must name a bucket or union
# several; see knowledge/decisions/series-and-bus-isolation.md.
datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      # the installation's organisation, stated once in infra/installation.ttl and handed to the
      # container by the infra/compose.yaml generated from it — interpolated as the token is
      organization: $INFLUX_ORG
      defaultBucket: genesis
    secureJsonData:
      token: $INFLUX_ADMIN_TOKEN
