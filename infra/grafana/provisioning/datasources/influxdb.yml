apiVersion: 1

# Auto-wires Grafana to InfluxDB (Flux). Token must match INFLUX_TOKEN in .env /
# docker-compose (default: dev-token-change-me).
datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: agora
      defaultBucket: sensors
    secureJsonData:
      token: dev-token-change-me
