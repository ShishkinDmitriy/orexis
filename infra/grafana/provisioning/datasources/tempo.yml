apiVersion: 1

# Auto-wires Grafana to Tempo, where each agent of a monitored world sends its activities as spans
# (orexis-journal-otlp/). Inside the infra project's network, so 3200 is published to nobody; no credential,
# since nothing but Grafana can reach it to read.
datasources:
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
