# Agora — let the boards reach the broker.
#
# Mosquitto 2.x binds to loopback only unless a listener says otherwise, so a freshly
# installed broker refuses every ESP32 on the LAN with "Connection refused" — which looks
# exactly like a firmware fault and is not one. This is the smallest config that fixes it.
#
# Baked into the image at /etc/mosquitto/conf.d/agora.conf — see the Containerfile beside it.
#
#   cd infra && podman compose up -d mosquitto
#   ss -lntp | grep 1883        # expect 0.0.0.0:1883, not 127.0.0.1:1883
#
# The bus is reachable from the LAN but no longer open to it. Every principal — each agent,
# each board — connects as itself and may say and hear exactly what the world wires it to; an
# unlisted user may do nothing at all. Both files below are GENERATED by `agora-mqtt` from
# every provisioned world's wiring, and mounted rather than baked, because they change
# whenever a world does. See knowledge/decisions/series-and-bus-isolation.md.
#
# So `cd infra && podman compose up -d` now has a prerequisite: run `agora-mqtt <world>` first,
# or the mounts resolve to directories and mosquitto exits reading its config.

listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.conf

# Start as root, then drop to this user — which is what makes `agora-mqtt` cost a RELOAD
# rather than a restart. Rootless podman cannot deliver a signal to a container whose PID 1 is
# an unprivileged user ("send signal to pidfd: Permission denied"), and the kernel shields a
# namespace's PID 1 from `kill` inside it, so with USER set in the image there was no way to
# SIGHUP the broker at all and the ACL could only be reloaded by recreating the container.
#
# Stated rather than inherited: mosquitto already defaults to `mosquitto` when started as
# root, and the host's AppArmor profile grants `capability setuid`/`setgid` precisely because
# this is the intended way to run it. The privileges are dropped before the first client is
# served.
user mosquitto

# Debian's stock config logs to a file, which in a container means `podman logs` goes silent
# after startup and a refused board leaves no trace anywhere you would think to look. Add
# stdout so the container behaves like every other service here.
log_dest stdout
connection_messages true
