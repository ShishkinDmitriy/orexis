# Agora — let the boards reach the broker.
#
# Mosquitto 2.x binds to loopback only unless a listener says otherwise, so a freshly
# installed broker refuses every ESP32 on the LAN with "Connection refused" — which looks
# exactly like a firmware fault and is not one. This is the smallest config that fixes it.
#
#   sudo cp infra/mosquitto/lan.conf /etc/mosquitto/conf.d/agora.conf
#   sudo systemctl restart mosquitto
#   ss -lntp | grep 1883        # expect 0.0.0.0:1883, not 127.0.0.1:1883
#
# What this accepts: the bus is open to anyone on your LAN, unauthenticated. That is already
# the v1 position rather than a new hole — the belief base enforces per-agent read isolation
# (decisions/belief-base-isolation.md), but the message bus has no ACLs at all, so a process
# on the broker can watch every reading. Do not put this on an untrusted network.

listener 1883 0.0.0.0
allow_anonymous true
