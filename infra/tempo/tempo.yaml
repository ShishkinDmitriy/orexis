# Tempo for the agents' spans: one process, blocks on its own volume, read by Grafana on 3200.
# Run by `infra/compose.yaml`, which `orexis-infra-compose` renders where infra/installation.ttl
# names an onboarding:Tracer. Each agent of a monitored world POSTs a pass's trace to 4318
# (orexis-span-opentelemetry/). Kept a week: spans are for seeing what triggered what lately, not a record —
# the journal is the record (knowledge/domain/kernel/journal.md).
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
compactor:
  compaction:
    block_retention: 168h
