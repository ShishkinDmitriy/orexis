# A world, run end to end from nothing (#47) — what `gates.yml` says it is not.
#
# The gates prove nothing obviously broke; every interesting failure this project has had was found
# by running the real thing: a keyfile the broker could not read, a bind mount that made `host.key`
# a directory, onboarding that only ever ran incrementally on a bench that already held a CA and
# credentials. This job starts with none of it: the images built in this run, the series store up,
# `orexis-onboard` from an empty `secrets/`, the world started on a fast clock, and
# `tools/run-world-end-to-end.sh` waiting for a reading to reach the agent and a command to come
# back answered. On a failure it says what did not happen, then prints every container's log.
#
# THE GREENHOUSE, because it closes the loop with one agent and no peer: the bed dries, the grower
# runs the pump, the simulator's next reading answers the step. Its bed takes two and a half world
# days to dry below its floor, so the pace decides the job's length.
#
# ON DEMAND ONLY, and not on a pull request, until a fast clock can pass it. Spiked at 1440x it
# could not: a reading holds exactly until the next is due, the simulator publishes once a real
# second whatever the pace, so at that pace the grower held no present reading most of the time,
# and a step taken then commanded nothing and was recorded taken. At 120x the bed takes about half
# an hour to dry. A flaky end-to-end job people learn to re-run is worse than none (#47).
#
# PODMAN, ROOTLESS, as the runner's own user: the generated compose files say `userns_mode: keep-id`,
# which is podman's. The admin token is the example's, minted for a store this job throws away.

name: world

on:
  workflow_dispatch:

concurrency:
  group: world-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  greenhouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" podman-compose
          podman --version && podman-compose --version
      - name: the installation's secrets, throwaway
        run: |
          mkdir -p infra/secrets
          cp infra/admin.env.example infra/secrets/admin.env
      - name: run the greenhouse end to end
        env:
          OREXIS_TIME_PACE: "120"
        run: tools/run-world-end-to-end.sh greenhouse grower 3000
