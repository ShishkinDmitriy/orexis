# The gates, run on a machine that is not the Pi.
#
# These are the checks AGENTS.md calls the gates, and they were being run by hand on every change —
# on a Raspberry Pi, where the suite takes the better part of a minute and the person or agent
# running it pays for reading the output. None of them need hardware, a broker, or a store: the
# tests build their belief bases in memory, and the rest read files. So they belong here.
#
# What is deliberately NOT here, and still has to be done by hand on the bench:
#
#   pytest infra    it rewrites a live broker's passwd and ACL, SIGHUPs it, and creates and
#                   deletes real Influx buckets. It is a contract with the infrastructure, not
#                   with this code, and there is no infrastructure here to hold to it.
#   the image       building it is easy; proving an agent BIRTHS, validates, connects over mTLS
#                   and ingests is not, and that is the check that has actually caught things.
#   a world         `podman compose up` and watching a reading travel simulator -> broker ->
#                   agent -> store. Every interesting failure this project has had was found
#                   there, not here.
#
# Green here means "nothing obviously broke". It does not mean a world runs.
#
# ON THE PULL REQUEST, and not on every push as well: a push that has a pull request open
# ran the same suite twice, and the minutes were metered while the repository was private. The sovereign's
# flow is push the draft, wait for this, mark it ready (judge-desires-then-derive-wants's
# session); a push with no pull request is a branch nobody has asked about yet. A newer push
# cancels the run in progress on the same branch, for the same reason.

name: gates

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

#
# IN PARALLEL JOBS: the two file gates in one, the repo's four whole-tree tests in another and the
# agent's and the worlds' suites in a third. Each job installs on a runner of its own — a minute,
# cached — and the wall time is the slowest job's rather than the sum. Agent 0.1.0, its suite and
# its packages' job were retired on 2026-09-26.

jobs:
  worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"      # what the agent image runs; see Containerfile
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A world is held to what it does by the tests beside it, which the `agent` job runs.

      # The one direction a directory cannot state: onboarding may import agent, and neither
      # the agent nor the simulator may import onboarding. See
      # knowledge/decisions/repository-layout.md.
      - name: import contracts
        run: lint-imports

      # Vendored in tools/ rather than invoked from a skill in someone's home directory — a gate
      # that only one machine can run is not a gate.
      - name: OKF bundle
        run: ./tools/validate-okf.sh knowledge

  repo:
    # THE REPO'S OWN GATES: the four files in `tests/` that read the whole tree — the bundle
    # (`test_knowledge`), what an agent image and an agent are given (`test_layout`), the prefixes
    # every query speaks (`test_store`) and the distribution's dependencies against its imports
    # (`test_projects`).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest, the repo's gates
        run: pytest -q -n auto tests

  agent:
    # The agent's own suites and every world's, the two trees `testpaths` names — the bench's
    # asserted plans included. The jobs name the trees apart so that a red says which.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest, the agent and the worlds
        run: pytest -q -n auto agent world
