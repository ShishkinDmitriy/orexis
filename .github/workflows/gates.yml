# The gates, run on a machine that is not the Pi.
#
# These are the four checks AGENTS.md calls the gates, and they were being run by hand on every
# change — on a Raspberry Pi, where the suite takes the better part of a minute and the person or
# agent running it pays for reading the output. None of them need hardware, a broker, or a store:
# `orexis-validate` builds a world in memory, the tests build their belief bases in memory, and the
# other two read files. So they belong here.
#
# What is deliberately NOT here, and still has to be done by hand on the bench:
#
#   pytest infra    it rewrites a live broker's passwd and ACL, SIGHUPs it, and creates and
#                   deletes real Influx buckets. It is a contract with the infrastructure, not
#                   with this code, and there is no infrastructure here to hold to it.
#   the image       building it is easy; proving an agent BIRTHS, validates, connects over mTLS
#                   and ingests is not, and that is the check that has actually caught things.
#   a world         `podman compose up` and watching a reading travel simulator -> broker ->
#                   agent -> store. Every interesting failure this project has had was found
#                   there, not here.
#
# Green here means "nothing obviously broke". It does not mean a world runs.
#
# ON THE PULL REQUEST, and not on every push as well: a push that has a pull request open
# ran the same suite twice, and the minutes were metered while the repository was private. The sovereign's
# flow is push the draft, wait for this, mark it ready (judge-desires-then-derive-wants's
# session); a push with no pull request is a branch nobody has asked about yet. A newer push
# cancels the run in progress on the same branch, for the same reason.

name: gates

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

#
# IN PARALLEL JOBS, since the sovereign asked whether the packages' tests could run apart from
# the rest: the worlds and the two file gates in one job, the repo's four gates in another, the
# packages' own tests in a third and Agent 0.2.0's suite in a fourth. Each job installs on a
# runner of its own — a minute, cached — and the wall time is the slowest job's rather than the
# sum; the minutes are free on a public repository. The 0.1.0 suite ran here too, `tests/` in
# four shards dealt round-robin, until 2026-09-25 — the `repo` job says why it is off.

jobs:
  worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"      # what the agent image runs; see Containerfile
          cache: pip
      # Every package is its own distribution (every-package-is-a-project), so every one is
      # installed, found by looking as the loader finds them.
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" $(ls -d packages/*/)

      # Each world is built from its files and held to every package's shapes.
      #
      # Found by looking, not listed — the same rule capabilities and packages are found by, and
      # for the same reason: a list here goes stale silently. It did. Removing `society` left
      # three hardcoded steps validating a world that no longer existed, and CI failed on a
      # change whose four local gates were all green, because none of them reads this file.
      #
      # The world is still named on failure, which is why the loop groups and annotates rather
      # than just running: a red X should say WHICH world, not send you into a log.
      - name: orexis-validate every world
        run: |
          # THE LIST IS ASKED FIRST AND HELD NON-EMPTY: with `$(…)` inside the `for`, an import
          # error printed to stderr, the loop ran over nothing and the gate passed having
          # validated no world — which is how the layout move went green here.
          worlds=$(python -c "from agent_old import genesis; print(' '.join(genesis.worlds()))") || exit 1
          [ -n "$worlds" ] || { echo "::error::no worlds to validate — is genesis importable?"; exit 1; }
          for w in $worlds; do
            echo "::group::orexis-validate $w"
            orexis-validate "$w" || { echo "::error::$w failed validation"; exit 1; }
            echo "::endgroup::"
          done

      # The layering the flat layout gave up a packaging split to assert: onboarding may import
      # agent, agent may never import onboarding, and no capability or transport may touch
      # onboarding at all. See knowledge/decisions/repository-layout.md.
      - name: import contracts
        run: lint-imports

      # Vendored in tools/ rather than invoked from a skill in someone's home directory — a gate
      # that only one machine can run is not a gate.
      - name: OKF bundle
        run: ./tools/validate-okf.sh knowledge

  repo:
    # THE REPO'S OWN GATES: the four files in `tests/` that read the whole tree rather than the
    # 0.1.0 kernel — the bundle (`test_knowledge`), the layout of both trees (`test_layout`),
    # the prefixes every query speaks (`test_store`) and each distribution's dependencies
    # against its imports (`test_projects`). The rest of `tests/` is the 0.1.0 suite, SWITCHED
    # OFF here since 2026-09-25 by the sovereign's decision: 0.1.0 is not started any more, and
    # its packages are amended into Agent 0.2.0's domains rather than copied, which breaks what
    # the old suite built on. `pytest tests` still runs it by hand.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" $(ls -d packages/*/)
      - name: pytest, the repo's gates
        run: pytest -q -n auto tests/test_knowledge.py tests/test_layout.py tests/test_store.py tests/test_projects.py

  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" $(ls -d packages/*/)
      # The packages' own tests are named, not reached through `pytest tests`: a package
      # carries its own beside its code, and the `repo` job above names four files of the
      # root tree alone.
      - name: pytest, the packages' own
        run: pytest -q -n auto packages
  agent:
    # Agent 0.2.0: `agent/` at the repo root and the worlds migrated to it under `world/`, two
    # of the trees `testpaths` names — its own suite, its bench's asserted plans included. The
    # jobs name the trees apart so that a red says which.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" $(ls -d packages/*/)
      - name: pytest, agent 0.2.0
        run: pytest -q -n auto agent world
