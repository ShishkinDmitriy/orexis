# PLANNING: what a pass finds — the worlds a want's search admits, takes and weighs — ported from
# `agent/planning/*.py` beside it, act by act, each held to the act's own snapshot cases
# (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis-planning"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
orexis = { path = ".." }
orexis-belief = { path = "../belief" }
oxigraph.workspace = true
oxsdatatypes = "0.2"
log = "0.4"
regex = "1"

[dev-dependencies]
orexis = { path = "..", features = ["snapshots"] }
