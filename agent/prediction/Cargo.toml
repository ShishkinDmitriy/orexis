# PREDICTION: what moves while nobody acts — the flows integrated from each ground the planner lays — ported from
# `agent/prediction/*.py` beside it, held to what its suite asks
# (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis-prediction"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
orexis = { path = ".." }
oxigraph.workspace = true
oxsdatatypes = "0.2"
log = "0.4"

[dev-dependencies]
orexis = { path = "..", features = ["snapshots"] }
orexis-belief = { path = "../belief" }
orexis-sensing = { path = "../sensing" }
