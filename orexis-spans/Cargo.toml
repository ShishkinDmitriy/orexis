# SPANS: every activity the agent begins and ends, sent to whoever traces it as an OpenTelemetry span over OTLP's JSON,
# knowing no package's words (packages-meet-by-events-policies-and-activities).
[package]
name = "orexis-spans"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory.workspace = true
orexis = { workspace = true }
oxigraph.workspace = true
serde_json = "1"
ureq = "2"
log = "0.4"

[dev-dependencies]
oxsdatatypes = "0.2"
