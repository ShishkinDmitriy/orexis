# METRICS: how the agent is doing, told to whoever administers it — every reported event tallied in a window and
# written once a window, ported from `agent/metrics/*.py` beside it, knowing no package's words.
[package]
name = "orexis-metrics"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
orexis = { workspace = true }
oxsdatatypes = "0.2"
log = "0.4"
