# SENSING: a transport hands it bytes and it makes percepts of them, and it says when a sensor has gone silent —
# ported from `agent/sensing/*.py` beside it, held to what its suite asks
# (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis-sensing"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
orexis = { workspace = true }
oxigraph.workspace = true
oxsdatatypes = "0.2"
serde_json = "1"
log = "0.4"

[dev-dependencies]
orexis = { workspace = true, features = ["snapshots"] }
orexis-belief = { workspace = true }
