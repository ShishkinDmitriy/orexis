# TRANSLATION: a person's prose in the chats an agent is in, heard through a language model at a run-time edge and
# answered or kept as a statement, and what the agent says to a person rendered for them — ported from
# `agent/translation/*.py` beside it, held to what its suite asks
# (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis-translation"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory.workspace = true
tokio.workspace = true
orexis = { workspace = true }
orexis-speech = { workspace = true }
oxigraph.workspace = true
oxsdatatypes = "0.2"
spargebra = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v5"] }
regex = "1"
ureq = "2"
log = "0.4"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
orexis = { workspace = true, features = ["snapshots"] }
