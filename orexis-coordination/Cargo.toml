# COORDINATION: two agents that want one resource ask each other what their constraint reads, and a draw decides which
# goes first — ported from `agent/coordination/*.py` beside it, held to what its suite asks
# (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis-coordination"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory.workspace = true
tokio.workspace = true
orexis = { workspace = true }
orexis-speech = { workspace = true }
oxigraph.workspace = true
oxsdatatypes = "0.2"
spargebra = "0.4"
sha2 = "0.11"
getrandom = "0.3"
log = "0.4"

[dev-dependencies]
orexis = { workspace = true, features = ["snapshots"] }
