# THE JOURNAL, OVER OTLP: the activities orexis-journal keeps in the journal, shipped on a timer to whoever traces the agent as spans
# over OTLP's JSON, knowing no package's words (packages-meet-by-events-policies-and-activities).
[package]
name = "orexis-journal-otlp"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory.workspace = true
orexis = { workspace = true }
oxigraph.workspace = true
serde_json = "1"
ureq = "2"
log = "0.4"
oxsdatatypes = "0.2"
tokio.workspace = true
