<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="600" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">The two cones: what I may do, and what may happen</text>
  <text x="600" y="57" text-anchor="middle" font-size="13" fill="#666">time runs left to right, and the present is the only settled world</text>

  <!-- the agent's cone: branches on choice, widens rightward -->
  <polygon points="452,352 1150,88 1150,352" fill="#EAF5EA" stroke="#5E9E5E" stroke-width="1.2"/>
  <text x="1140" y="122" text-anchor="end" font-size="13" font-weight="700" fill="#3d7a3d">the agent's cone — branches on CHOICE</text>
  <text x="1140" y="142" text-anchor="end" font-size="11.5" fill="#4a7a4a">searched: each branch is a step I may take, and a plan is a path through them</text>

  <!-- the world's cone: branches on uncertainty -->
  <polygon points="452,358 1150,358 1150,622" fill="#FDF0F0" stroke="#B05A5A" stroke-width="1.2"/>
  <text x="1140" y="576" text-anchor="end" font-size="13" font-weight="700" fill="#8f4444">the world's cone — branches on UNCERTAINTY</text>
  <text x="1140" y="596" text-anchor="end" font-size="11.5" fill="#8f4444">not searched: nobody chooses these, so they are folded into each node</text>

  <!-- the axis -->
  <line x1="40" y1="355" x2="1168" y2="355" stroke="#444" stroke-width="1.6"/>
  <polygon points="1178,355 1164,349 1164,361" fill="#444"/>
  <text x="1160" y="344" text-anchor="end" font-size="12" fill="#444">time</text>

  <!-- the past -->
  <text x="226" y="311" text-anchor="middle" font-size="13" font-weight="700" fill="#555">PAST</text>
  <rect x="60" y="333" width="96" height="44" rx="4" fill="#F2F2F2" stroke="#9a9a9a"/>
  <text x="108" y="352" text-anchor="middle" font-size="11" fill="#333">dosed</text>
  <text x="108" y="367" text-anchor="middle" font-size="10.5" fill="#666">answered</text>
  <rect x="178" y="333" width="96" height="44" rx="4" fill="#F2F2F2" stroke="#9a9a9a"/>
  <text x="226" y="352" text-anchor="middle" font-size="11" fill="#333">looked</text>
  <text x="226" y="367" text-anchor="middle" font-size="10.5" fill="#666">answered</text>
  <rect x="296" y="333" width="96" height="44" rx="4" fill="#F2F2F2" stroke="#9a9a9a"/>
  <text x="344" y="352" text-anchor="middle" font-size="11" fill="#333">heated</text>
  <text x="344" y="367" text-anchor="middle" font-size="10.5" fill="#666">answered</text>
  <text x="226" y="401" text-anchor="middle" font-size="11.5" fill="#666">what was done, and what the world answered</text>
  <text x="226" y="419" text-anchor="middle" font-size="11.5" fill="#666">an intention becomes an act, and the act becomes history</text>

  <!-- the present -->
  <line x1="452" y1="80" x2="452" y2="668" stroke="#5B8DB8" stroke-width="2" stroke-dasharray="6 5"/>
  <circle cx="452" cy="355" r="8" fill="#5B8DB8"/>
  <text x="440" y="98" text-anchor="end" font-size="13" font-weight="700" fill="#2f5d84">PRESENT</text>
  <text x="440" y="116" text-anchor="end" font-size="11.5" fill="#2f5d84">one world, observed</text>
  <text x="440" y="133" text-anchor="end" font-size="11.5" fill="#2f5d84">nothing here is uncertain</text>

  <!-- the agent's branches -->
  <line x1="452" y1="355" x2="640" y2="330" stroke="#5E9E5E" stroke-width="1.6"/>
  <line x1="452" y1="355" x2="640" y2="298" stroke="#5E9E5E" stroke-width="1.6"/>
  <line x1="640" y1="330" x2="880" y2="300" stroke="#5E9E5E" stroke-width="1.6"/>
  <line x1="640" y1="298" x2="880" y2="258" stroke="#5E9E5E" stroke-width="1.6"/>
  <line x1="640" y1="298" x2="880" y2="220" stroke="#5E9E5E" stroke-width="1.6"/>
  <circle cx="640" cy="330" r="6" fill="#5E9E5E"/><text x="652" y="334" font-size="11.5" fill="#2f5f2f">if I dose</text>
  <circle cx="640" cy="298" r="6" fill="#5E9E5E"/><text x="652" y="290" font-size="11.5" fill="#2f5f2f">if I heat</text>
  <circle cx="880" cy="300" r="6" fill="#5E9E5E"/><text x="892" y="304" font-size="11.5" fill="#2f5f2f">dose, then heat</text>
  <circle cx="880" cy="258" r="6" fill="#5E9E5E"/><text x="892" y="262" font-size="11.5" fill="#2f5f2f">heat, then dose</text>
  <circle cx="880" cy="220" r="6" fill="#5E9E5E"/><text x="892" y="224" font-size="11.5" fill="#2f5f2f">heat, then vent</text>

  <!-- what may happen: the set of possibilities widens with distance -->
  <g stroke="#B05A5A" stroke-width="1">
    <rect x="596" y="372" width="86" height="20" rx="3" fill="#F6BDBD"/>
    <rect x="838" y="372" width="86" height="20" rx="3" fill="#F8CACA"/>
    <rect x="838" y="400" width="86" height="20" rx="3" fill="#F8CACA"/>
    <rect x="1032" y="372" width="86" height="20" rx="3" fill="#FBDCDC"/>
    <rect x="1032" y="400" width="86" height="20" rx="3" fill="#FBDCDC"/>
    <rect x="1032" y="428" width="86" height="20" rx="3" fill="#FBDCDC"/>
    <rect x="1032" y="456" width="86" height="20" rx="3" fill="#FBDCDC"/>
  </g>
  <text x="639" y="386" text-anchor="middle" font-size="10.5" fill="#7a3838">below</text>
  <text x="881" y="386" text-anchor="middle" font-size="10.5" fill="#7a3838">below</text>
  <text x="881" y="414" text-anchor="middle" font-size="10.5" fill="#7a3838">in region</text>
  <text x="1075" y="386" text-anchor="middle" font-size="10.5" fill="#7a3838">below</text>
  <text x="1075" y="414" text-anchor="middle" font-size="10.5" fill="#7a3838">in region</text>
  <text x="1075" y="442" text-anchor="middle" font-size="10.5" fill="#7a3838">above</text>
  <text x="1075" y="470" text-anchor="middle" font-size="10.5" fill="#7a3838">unknown</text>
  <text x="639" y="410" text-anchor="middle" font-size="11" font-weight="700" fill="#8f4444">in an hour</text>
  <text x="881" y="438" text-anchor="middle" font-size="11" font-weight="700" fill="#8f4444">by tonight</text>
  <text x="1075" y="494" text-anchor="middle" font-size="11" font-weight="700" fill="#8f4444">in three days</text>

  <!-- and they come toward us, narrowing -->
  <line x1="1118" y1="652" x2="484" y2="652" stroke="#B05A5A" stroke-width="1.8"/>
  <polygon points="470,652 486,645 486,659" fill="#B05A5A"/>
  <text x="1118" y="638" text-anchor="end" font-size="11.5" fill="#8f4444">a forecast appears far out and comes toward us, narrowing as it comes, without us</text>

  <!-- what the picture adds -->
  <rect x="60" y="470" width="500" height="98" rx="5" fill="#FBF7E8" stroke="#C9B47A"/>
  <text x="76" y="493" font-size="12" font-weight="700" fill="#5c4f28">What this picture adds: every node carries a TIME.</text>
  <text x="76" y="515" font-size="11.5" fill="#5c4f28">Two worlds holding the same facts at different instants are</text>
  <text x="76" y="532" font-size="11.5" fill="#5c4f28">different worlds, because the world keeps moving whether or</text>
  <text x="76" y="549" font-size="11.5" fill="#5c4f28">not the agent does: soil dries, rain comes, night falls.</text>
</svg>
