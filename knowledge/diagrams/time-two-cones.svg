<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>
  <defs>
  <marker id="ga" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#5E9E5E"/></marker>
  <marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#B05A5A"/></marker>
  <marker id="ka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9a9a9a"/></marker>
  </defs>
  <text x="600" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">The two cones: one tree of possible worlds</text>
  <text x="600" y="57" text-anchor="middle" font-size="13" fill="#666">every node is a possible world — a CHOSEN edge is a step the agent takes, a HAPPENING edge is the world’s</text>
  <polygon points="452,300 1180,52 1180,350 452,350" fill="#EAF5EA" stroke="#5E9E5E" stroke-width="1.1"/>
  <polygon points="452,360 1180,360 1180,672 452,450" fill="#FDF0F0" stroke="#B05A5A" stroke-width="1.1"/>
  <line x1="20" y1="355" x2="1168" y2="355" stroke="#444" stroke-width="1.6"/>
  <polygon points="1180,355 1164,349 1164,361" fill="#444"/>
  <text x="1160" y="343" text-anchor="end" font-size="12" fill="#444">time</text>
  <line x1="452" y1="72" x2="452" y2="690" stroke="#5B8DB8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="176" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#555">PAST</text>
  <text x="176" y="320" text-anchor="middle" font-size="11" fill="#777">what happened, and how</text>
  <rect x="34" y="332" width="116" height="46" rx="4" fill="#F2F2F2" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="92" y="350" text-anchor="middle" font-size="10.5" fill="#333">soil: below</text>
  <text x="92" y="365" text-anchor="middle" font-size="10.5" fill="#333">air: above</text>
  <rect x="200" y="332" width="116" height="46" rx="4" fill="#F2F2F2" stroke="#9a9a9a" stroke-width="1.3"/>
  <text x="258" y="350" text-anchor="middle" font-size="10.5" fill="#333">soil: below</text>
  <text x="258" y="365" text-anchor="middle" font-size="10.5" fill="#333">air: in region</text>
  <rect x="394" y="332" width="116" height="46" rx="4" fill="#EAF2F8" stroke="#5B8DB8" stroke-width="1.3"/>
  <text x="452" y="350" text-anchor="middle" font-size="10.5" fill="#1d3b4c">soil: below</text>
  <text x="452" y="365" text-anchor="middle" font-size="10.5" fill="#1d3b4c">air: below</text>
  <line x1="150" y1="355" x2="200" y2="355" stroke="#5E9E5E" stroke-width="1.6" marker-end="url(#ga)"/>
  <text x="175" y="347" text-anchor="middle" font-size="11" font-style="italic" fill="#5E9E5E">vented</text>
  <line x1="316" y1="355" x2="394" y2="355" stroke="#B05A5A" stroke-width="1.6" marker-end="url(#ra)"/>
  <text x="355" y="347" text-anchor="middle" font-size="11" font-style="italic" fill="#B05A5A">night fell</text>
  <text x="438" y="96" text-anchor="end" font-size="13" font-weight="700" fill="#2f5d84">PRESENT</text>
  <text x="438" y="114" text-anchor="end" font-size="11.5" fill="#2f5d84">one world, observed</text>
  <text x="438" y="132" text-anchor="end" font-size="11.5" fill="#2f5d84">both kinds of edge are known</text>
  <rect x="642" y="292" width="116" height="46" rx="4" fill="#ffffff" stroke="#5E9E5E" stroke-width="1.3"/>
  <text x="700" y="310" text-anchor="middle" font-size="10.5" fill="#22301f">soil: in region</text>
  <text x="700" y="325" text-anchor="middle" font-size="10.5" fill="#22301f">air: below</text>
  <rect x="642" y="239" width="116" height="46" rx="4" fill="#ffffff" stroke="#5E9E5E" stroke-width="1.3"/>
  <text x="700" y="257" text-anchor="middle" font-size="10.5" fill="#22301f">soil: below</text>
  <text x="700" y="272" text-anchor="middle" font-size="10.5" fill="#22301f">air: in region</text>
  <rect x="932" y="297" width="116" height="46" rx="4" fill="#ffffff" stroke="#5E9E5E" stroke-width="1.3"/>
  <text x="990" y="315" text-anchor="middle" font-size="10.5" fill="#22301f">soil: in region</text>
  <text x="990" y="330" text-anchor="middle" font-size="10.5" fill="#22301f">air: in region</text>
  <rect x="932" y="222" width="116" height="46" rx="4" fill="#ffffff" stroke="#5E9E5E" stroke-width="1.3"/>
  <text x="990" y="240" text-anchor="middle" font-size="10.5" fill="#22301f">soil: in region</text>
  <text x="990" y="255" text-anchor="middle" font-size="10.5" fill="#22301f">air: in region</text>
  <rect x="932" y="149" width="116" height="46" rx="4" fill="#ffffff" stroke="#5E9E5E" stroke-width="1.3"/>
  <text x="990" y="167" text-anchor="middle" font-size="10.5" fill="#22301f">soil: below</text>
  <text x="990" y="182" text-anchor="middle" font-size="10.5" fill="#22301f">air: below</text>
  <line x1="510" y1="355" x2="642" y2="315" stroke="#5E9E5E" stroke-width="1.6" marker-end="url(#ga)"/>
  <text x="576" y="328" text-anchor="middle" font-size="11" font-style="italic" fill="#5E9E5E">dosing</text>
  <line x1="510" y1="355" x2="642" y2="262" stroke="#5E9E5E" stroke-width="1.6" marker-end="url(#ga)"/>
  <text x="576" y="301.5" text-anchor="middle" font-size="11" font-style="italic" fill="#5E9E5E">heating</text>
  <line x1="758" y1="315" x2="932" y2="320" stroke="#5E9E5E" stroke-width="1.6" marker-end="url(#ga)"/>
  <text x="845" y="310.5" text-anchor="middle" font-size="11" font-style="italic" fill="#5E9E5E">heating</text>
  <line x1="758" y1="262" x2="932" y2="245" stroke="#5E9E5E" stroke-width="1.6" marker-end="url(#ga)"/>
  <text x="845" y="246.5" text-anchor="middle" font-size="11" font-style="italic" fill="#5E9E5E">dosing</text>
  <line x1="758" y1="262" x2="932" y2="172" stroke="#5E9E5E" stroke-width="1.6" marker-end="url(#ga)"/>
  <text x="845" y="210" text-anchor="middle" font-size="11" font-style="italic" fill="#5E9E5E">venting</text>
  <text x="1056" y="324" font-size="10.5" font-weight="700" fill="#2f5f2f">✓ the want is met</text>
  <text x="1056" y="249" font-size="10.5" font-weight="700" fill="#2f5f2f">✓ the want is met</text>
  <text x="1056" y="176" font-size="10.5" fill="#6a8a6a">no better, this cold</text>
  <text x="1170" y="90" text-anchor="end" font-size="13" font-weight="700" fill="#3d7a3d">CHOSEN edges — the agent’s steps</text>
  <text x="1170" y="110" text-anchor="end" font-size="11.5" fill="#4a7a4a">searched: the agent may prefer among the worlds they reach</text>
  <rect x="642" y="395" width="116" height="46" rx="4" fill="#ffffff" stroke="#B05A5A" stroke-width="1.3"/>
  <text x="700" y="413" text-anchor="middle" font-size="10.5" fill="#22301f">soil: in region</text>
  <text x="700" y="428" text-anchor="middle" font-size="10.5" fill="#22301f">air: below</text>
  <rect x="642" y="453" width="116" height="46" rx="4" fill="#ffffff" stroke="#B05A5A" stroke-width="1.3"/>
  <text x="700" y="471" text-anchor="middle" font-size="10.5" fill="#22301f">soil: below</text>
  <text x="700" y="486" text-anchor="middle" font-size="10.5" fill="#22301f">air: below</text>
  <rect x="932" y="377" width="116" height="46" rx="4" fill="#ffffff" stroke="#B05A5A" stroke-width="1.3"/>
  <text x="990" y="395" text-anchor="middle" font-size="10.5" fill="#22301f">soil: in region</text>
  <text x="990" y="410" text-anchor="middle" font-size="10.5" fill="#22301f">air: in region</text>
  <rect x="932" y="457" width="116" height="46" rx="4" fill="#ffffff" stroke="#B05A5A" stroke-width="1.3"/>
  <text x="990" y="475" text-anchor="middle" font-size="10.5" fill="#22301f">soil: in region</text>
  <text x="990" y="490" text-anchor="middle" font-size="10.5" fill="#22301f">air: below</text>
  <rect x="932" y="537" width="116" height="46" rx="4" fill="#ffffff" stroke="#B05A5A" stroke-width="1.3"/>
  <text x="990" y="555" text-anchor="middle" font-size="10.5" fill="#22301f">soil: below</text>
  <text x="990" y="570" text-anchor="middle" font-size="10.5" fill="#22301f">air: below</text>
  <line x1="510" y1="355" x2="642" y2="418" stroke="#B05A5A" stroke-width="1.6" marker-end="url(#ra)"/>
  <text x="576" y="379.5" text-anchor="middle" font-size="11" font-style="italic" fill="#B05A5A">it rains</text>
  <line x1="510" y1="355" x2="642" y2="476" stroke="#B05A5A" stroke-width="1.6" marker-end="url(#ra)"/>
  <text x="576" y="428.5" text-anchor="middle" font-size="11" font-style="italic" fill="#B05A5A">no rain</text>
  <line x1="758" y1="418" x2="932" y2="400" stroke="#B05A5A" stroke-width="1.6" marker-end="url(#ra)"/>
  <text x="845" y="402" text-anchor="middle" font-size="11" font-style="italic" fill="#B05A5A">dawn warms</text>
  <line x1="758" y1="418" x2="932" y2="480" stroke="#B05A5A" stroke-width="1.6" marker-end="url(#ra)"/>
  <text x="845" y="462" text-anchor="middle" font-size="11" font-style="italic" fill="#B05A5A">stays overcast</text>
  <line x1="758" y1="476" x2="932" y2="560" stroke="#B05A5A" stroke-width="1.6" marker-end="url(#ra)"/>
  <text x="845" y="531" text-anchor="middle" font-size="11" font-style="italic" fill="#B05A5A">a frost</text>
  <text x="1170" y="614" text-anchor="end" font-size="13" font-weight="700" fill="#8f4444">HAPPENING edges — the world’s</text>
  <text x="1170" y="634" text-anchor="end" font-size="11.5" fill="#8f4444">not searched: nobody prefers among these, so they fold into the node they leave</text>
  <text x="1170" y="660" text-anchor="end" font-size="11.5" fill="#8f4444">a forecast appears far out and comes toward us, narrowing as it comes, without us</text>
  <rect x="652" y="342" width="96" height="16" fill="#ffffff"/>
  <text x="700" y="354" text-anchor="middle" font-size="10" fill="#777">in an hour</text>
  <rect x="942" y="342" width="96" height="16" fill="#ffffff"/>
  <text x="990" y="354" text-anchor="middle" font-size="10" fill="#777">by tonight</text>
  <rect x="26" y="470" width="404" height="140" rx="5" fill="#FBF7E8" stroke="#C9B47A"/>
  <text x="42" y="493" font-size="12" font-weight="700" fill="#5c4f28">One tree, two kinds of edge — every node has a TIME.</text>
  <text x="42" y="514" font-size="11.5" font-weight="400" fill="#5c4f28">Two possible worlds holding the same facts at different</text>
  <text x="42" y="531" font-size="11.5" font-weight="400" fill="#5c4f28">instants are different worlds: soil dries, rain comes,</text>
  <text x="42" y="548" font-size="11.5" font-weight="400" fill="#5c4f28">night falls, whether or not the agent does anything. The</text>
  <text x="42" y="565" font-size="11.5" font-weight="400" fill="#5c4f28">two ✓ worlds above are two worlds, not one twice.</text>
  <text x="42" y="582" font-size="11.5" font-weight="400" fill="#5c4f28">A world differs from another by the BANDS its readings</text>
  <text x="42" y="599" font-size="11.5" font-weight="400" fill="#5c4f28">are in; soil is the bed’s moisture, air its temperature.</text>
</svg>
