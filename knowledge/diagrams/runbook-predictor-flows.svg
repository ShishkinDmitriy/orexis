<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="548px" preserveAspectRatio="none" style="width:768px;height:548px;background:#FFFFFF;" version="1.1" viewBox="0 0 768 548" width="768px" zoomAndPan="magnify"><title>A predictor &#8212; flows integrated from each ground</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="387.9258" x="183.2832" y="22.9951">A predictor &#8212; flows integrated from each ground</text></g><!--entity OBS--><g class="entity" data-entity="OBS" data-source-line="16" data-uid="ent0002" id="entity_OBS"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="128.5156" x="7" y="51.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.5156" x="17" y="72.4355">latest observation</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="50.7949" x="17" y="86.4043">soil 0.36</text></g><!--entity D1--><g class="entity" data-entity="D1" data-source-line="17" data-uid="ent0003" id="entity_D1"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="178.5605" x="171" y="51.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="88.2715" x="181" y="72.4355">climate:Drying</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.5605" x="181" y="86.4043">reads climate:driesPerDay</text></g><!--entity D2--><g class="entity" data-entity="D2" data-source-line="18" data-uid="ent0004" id="entity_D2"><rect fill="#FFFFFF" height="61.9063" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="175.543" x="385.5" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93.627" x="395.5" y="65.4355">climate:Raining</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="155.543" x="395.5" y="79.4043">reads climate:wetsPerMm</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125.7305" x="395.5" y="93.373">and the rain forecast</text></g><!--entity D3--><g class="entity" data-entity="D3" data-source-line="19" data-uid="ent0005" id="entity_D3"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="165.9922" x="596.5" y="51.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.4785" x="606.5" y="72.4355">actuation:Dosed</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.9922" x="606.5" y="86.4043">reads a committed dose</text></g><!--entity SUM--><g class="entity" data-entity="SUM" data-source-line="20" data-uid="ent0006" id="entity_SUM"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="226.9473" x="253" y="167.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.957" x="263" y="188.4355">sum of the flows' rates</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="206.9473" x="263" y="202.4043">per key, from the ground standing</text></g><!--entity BANDS--><g class="entity" data-entity="BANDS" data-source-line="21" data-uid="ent0007" id="entity_BANDS"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="191.7852" x="187.5" y="276.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="80.7188" x="197.5" y="297.4355">the next knot</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.7852" x="197.5" y="311.4043">a crossing, or the hour's end</text></g><!--entity G--><g class="entity" data-entity="G" data-source-line="22" data-uid="ent0008" id="entity_G"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="228.6055" x="252" y="385.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="115.166" x="262" y="406.4355">a ground laid there</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.6055" x="262" y="420.4043">0.04 a day: Dry in a day and a half</text></g><!--entity P--><g class="entity" data-entity="P" data-source-line="23" data-uid="ent0009" id="entity_P"><rect fill="#EAF5EA" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="154.5195" x="289" y="494.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="52.0723" x="299" y="515.4355">planning</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.5195" x="299" y="529.4043">a want for that instant</text></g><!--link OBS to SUM--><g class="link" data-entity-1="OBS" data-entity-2="SUM" data-source-line="25" data-uid="lnk10" id="link_OBS_SUM"><path d="M131.2,99.3669 C182.38,119.1469 250.1431,145.3347 301.2931,165.0947" fill="none" id="OBS-to-SUM" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="306.89,167.2569,299.9361,160.2824,302.2259,165.4551,297.0532,167.7449,306.89,167.2569" style="stroke:#181818;stroke-width:1;"/></g><!--link D1 to SUM--><g class="link" data-entity-1="D1" data-entity-2="SUM" data-source-line="26" data-uid="lnk11" id="link_D1_SUM"><path d="M281.95,99.3669 C300.34,119.1469 322.6135,143.1036 340.9935,162.8636" fill="none" id="D1-to-SUM" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="345.08,1