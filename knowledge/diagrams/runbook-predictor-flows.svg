<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="544px" preserveAspectRatio="none" style="width:768px;height:544px;background:#FFFFFF;" version="1.1" viewBox="0 0 768 544" width="768px" zoomAndPan="magnify"><title>A predictor &#8212; flows summed into bands ahead</title><defs/><g><g class="title" data-source-line="1"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="367.7188" x="193.3867" y="22.9951">A predictor &#8212; flows summed into bands ahead</text></g><!--entity OBS--><g class="entity" data-entity="OBS" data-source-line="16" data-uid="ent0002" id="entity_OBS"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="128.5156" x="7" y="51.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.5156" x="17" y="72.4355">latest observation</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="50.7949" x="17" y="86.4043">soil 0.36</text></g><!--entity D1--><g class="entity" data-entity="D1" data-source-line="17" data-uid="ent0003" id="entity_D1"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="178.5605" x="171" y="51.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="88.2715" x="181" y="72.4355">climate:Drying</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="158.5605" x="181" y="86.4043">reads climate:driesPerDay</text></g><!--entity D2--><g class="entity" data-entity="D2" data-source-line="18" data-uid="ent0004" id="entity_D2"><rect fill="#FFFFFF" height="61.9063" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="175.543" x="385.5" y="44.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="93.627" x="395.5" y="65.4355">climate:Raining</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="155.543" x="395.5" y="79.4043">reads climate:wetsPerMm</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="125.7305" x="395.5" y="93.373">and the rain forecast</text></g><!--entity D3--><g class="entity" data-entity="D3" data-source-line="19" data-uid="ent0005" id="entity_D3"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="165.9922" x="596.5" y="51.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.4785" x="606.5" y="72.4355">actuation:Dosed</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="145.9922" x="606.5" y="86.4043">reads a committed dose</text></g><!--entity SUM--><g class="entity" data-entity="SUM" data-source-line="20" data-uid="ent0006" id="entity_SUM"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="156.957" x="288" y="166.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="136.957" x="298" y="187.4355">sum of the flows' rates</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="75.3809" x="298" y="201.4043">per property</text></g><!--entity BANDS--><g class="entity" data-entity="BANDS" data-source-line="21" data-uid="ent0007" id="entity_BANDS"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="118.3672" x="307.5" y="274.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="77.5723" x="317.5" y="295.4355">bands ahead</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="98.3672" x="317.5" y="309.4043">until the horizon</text></g><!--entity G--><g class="entity" data-entity="G" data-source-line="22" data-uid="ent0008" id="entity_G"><rect fill="#FFFFFF" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="228.6055" x="252" y="382.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="105.293" x="262" y="403.4355">foreseen grounds</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="208.6055" x="262" y="417.4043">0.04 a day: Dry in a day and a half</text></g><!--entity P--><g class="entity" data-entity="P" data-source-line="23" data-uid="ent0009" id="entity_P"><rect fill="#EAF5EA" height="47.9375" rx="2.5" ry="2.5" style="stroke:#8FB4D0;stroke-width:0.5;" width="154.5195" x="289" y="490.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="52.0723" x="299" y="511.4355">planning</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.5195" x="299" y="525.4043">a want for that instant</text></g><!--link OBS to SUM--><g class="link" data-entity-1="OBS" data-entity-2="SUM" data-source-line="25" data-uid="lnk10" id="link_OBS_SUM"><path d="M131.55,99.2969 C182.51,118.8169 249.667,144.5406 300.677,164.0806" fill="none" id="OBS-to-SUM" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="306.28,166.2269,299.3064,159.2721,301.6108,164.4383,296.4447,166.7428,306.28,166.2269" style="stroke:#181818;stroke-width:1;"/></g><!--link D1 to SUM--><g class="link" data-entity-1="D1" data-entity-2="SUM" data-source-line="26" data-uid="lnk11" id="link_D1_SUM"><path d="M282.21,99.4369 C300.5,118.9369 322.4354,142.3206 340.7154,161.8106" fill="none" id="D1-to-SUM" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="344.82,166.1869,341.5806,156.886,341.3995,162.5399,335.7455