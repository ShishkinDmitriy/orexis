# EXECUTION: the intentions this agent is committed to and the steps that carry them out — ported from
# `agent/execution/*.py` beside it, held to what its suite asks
# (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis-execution"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory.workspace = true
tokio.workspace = true
orexis = { workspace = true }
orexis-speech = { workspace = true }
oxigraph.workspace = true
oxsdatatypes = "0.2"
log = "0.4"
getrandom = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
orexis = { workspace = true, features = ["snapshots"] }
