# THE AGENT, in Rust (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md). Each package is a crate of
# its own at the root, `orexis-<package>/`, beside its ontology and its documents; the kernel is `orexis/` and the
# binary `orexis-agent/`. A crate names another by the workspace's dependency, never by its path.
[workspace]
resolver = "3"
members = ["orexis", "orexis-*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
inventory = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
orexis = { path = "orexis" }
orexis-belief = { path = "orexis-belief" }
orexis-coordination = { path = "orexis-coordination" }
orexis-execution = { path = "orexis-execution" }
orexis-journal = { path = "orexis-journal" }
orexis-journal-otlp = { path = "orexis-journal-otlp" }
orexis-journal-oxigraph = { path = "orexis-journal-oxigraph" }
orexis-metrics = { path = "orexis-metrics" }
orexis-planning = { path = "orexis-planning" }
orexis-prediction = { path = "orexis-prediction" }
orexis-sensing = { path = "orexis-sensing" }
orexis-sensing-influxdb = { path = "orexis-sensing-influxdb" }
orexis-speech = { path = "orexis-speech" }
orexis-translation = { path = "orexis-translation" }
orexis-transport-email = { path = "orexis-transport-email" }
orexis-transport-http = { path = "orexis-transport-http" }
orexis-transport-mqtt = { path = "orexis-transport-mqtt" }
orexis-transport-telegram = { path = "orexis-transport-telegram" }
oxigraph = { version = "0.5", default-features = false }

# THE ENGINE OPTIMISED IN A TEST BUILD: a day of the greenhouse spends nearly all its time in oxigraph and spargebra,
# and unoptimised they took six minutes for what an optimised build does in forty seconds — so every dependency is
# built optimised, once, and the workspace's own crates stay quick to rebuild and to debug.
[profile.dev.package."*"]
opt-level = 3

# BUT NOT ROCKSDB, the volume's C++, which nothing in a test spends its time in and which took ten minutes to build
# optimised on CI's runner, past the job's limit.
[profile.dev.package.oxrocksdb-sys]
opt-level = 0
