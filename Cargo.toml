# THE RUST AGENT, ported one package at a time beside the Python one
# (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md). Each package is a crate in its
# own directory of `agent/`, beside its ontology and its Python, so both read the same documents.
[workspace]
resolver = "3"
members = ["agent", "agent/belief", "agent/coordination", "agent/execution", "agent/history", "agent/metrics", "agent/spans", "agent/planning", "agent/prediction", "agent/sensing", "agent/speech", "agent/translation", "agent/transport/http", "agent/transport/mqtt", "agent/transport/telegram", "agent/transport/email", "binary"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
oxigraph = { version = "0.5", default-features = false }

# THE ENGINE OPTIMISED IN A TEST BUILD: a day of the greenhouse spends nearly all its time in oxigraph and spargebra,
# and unoptimised they took six minutes for what an optimised build does in forty seconds — so every dependency is
# built optimised, once, and the workspace's own crates stay quick to rebuild and to debug.
[profile.dev.package."*"]
opt-level = 3

# BUT NOT ROCKSDB, the volume's C++, which nothing in a test spends its time in and which took ten minutes to build
# optimised on CI's runner, past the job's limit.
[profile.dev.package.oxrocksdb-sys]
opt-level = 0
