[project]
name = "orexis"
version = "0.1.0"
description = "Orexis — a market society of agents that bid for a scarce resource"
requires-python = ">=3.10"

# `orexis` is ASSEMBLY, the KERNEL and the OPERATOR'S TOOLS — the three trees at the repo root.
# Every package under `packages/` is its own project with its own dependencies, and this one
# does not depend on any of them: the kernel loads packages and never needs one, which is a
# claim `pip install -e .` alone now demonstrates. See knowledge/decisions/every-package-is-a-project.md.
#
# What did NOT come back is the boundary two pyprojects used to pretend to draw. `onboarding/`
# still ships in this distribution beside `agent/`, because packaging never kept the operator's
# tools out of an agent — the Containerfile not naming the tree does, and lint-imports holds
# the direction. Twenty-two distributions are not a boundary either; they are a dependency
# graph, which is a different thing and the thing that was missing.
#
# Every name below is imported by `agent/` or `onboarding/`. Nothing else is listed, and
# tests/test_layout.py holds this list to exactly what those two trees import.
dependencies = [
    #  assembly/ and agent/ — rdflib is DIRECT (nine imports across the three trees) and used
    #  to arrive only as a transitive of pyshacl, which is free to drop or re-pin it.
    "rdflib>=7",
    "pyoxigraph>=0.4",
    "pyshacl>=0.26",
    "python-dotenv>=1.0",
    "cryptography>=42",
    #  onboarding/ — the operator's tools reach both services and read a drawing
    "influxdb-client>=1.40",
    "paho-mqtt>=2.0",
    "pyyaml>=6",
]

[project.optional-dependencies]
# wireviz is a DEV dependency and not a runtime one: orexis-wireviz only writes YAML,
# and nothing in agent/ or the other generators imports it. It is here because the
# tests feed the generated harness to wireviz itself — the only check worth trusting
# for an output format nobody here can eyeball, since it is easy to emit YAML that
# parses and that the tool then rejects. Rendering to SVG additionally needs the
# graphviz BINARY, which pip cannot install and no test needs.
dev = ["pytest>=8", "import-linter>=2", "wireviz>=0.4", "pytest-xdist>=3"]

[project.scripts]
# The agent. One process, one agent, told only its own id.
orexis-agent = "agent.runtime:main"

# ONBOARDING — everything between a ratified world and a society that can be started. The
# umbrella runs the four below; they stay separately callable because rotating one service's
# credentials should not touch the other's.
orexis-onboard = "onboarding.onboard:main"
orexis-validate = "onboarding.validate:main"
orexis-influx = "onboarding.influx:main"
orexis-mqtt = "onboarding.mqtt:main"
orexis-compose = "onboarding.compose:main"
orexis-dashboards = "onboarding.dashboards:main"
orexis-wokwi = "onboarding.wokwi:main"
orexis-wireviz = "onboarding.wireviz:main"
# A board's config.h is a per-instance deployment fact, and every value in it is already
# stated by the world. Regenerating beats retrieving the board.
orexis-firmware = "onboarding.firmware:main"
# Once per world, before it is onboarded. An agent may LOAD its two keys; it may not mint them.
orexis-keygen = "onboarding.keygen:main"
orexis-ask = "onboarding.ask:main"
# INFRA, not onboarding: the services' own identities and whom the broker trusts. Its lifecycle
# is the infrastructure's — possibly another host, certainly another schedule.
orexis-infra-certs = "onboarding.infra_certs:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Three roots at the repo top: what assembles a build, the kernel it assembles onto, and the
# operator's tools. `packages*` is NOT among them — every package installs itself, claiming its
# own leaf and leaving `packages/` and `packages/<family>/` unclaimed as PEP 420 namespace
# portions. That is what lets a twenty-second package be installed from another repository and
# land in the same namespace as these twenty-one.
where = ["."]
include = ["assembly*", "agent*", "onboarding*"]

# ---------------------------------------------------------------------------------------------
# THE WORKSPACE. Twenty-one packages and this root are one resolution, so a checkout is set up
# with `uv sync --all-packages` and a package's dependency on a sibling resolves to the
# directory rather than to an index that has never heard of it.
#
# uv is the ergonomics, not the mechanism: every member is an ordinary PEP 621 project, so
# `pip install -e . $(ls -d packages/*/*/)` is the same install and is what the Containerfile
# does. Nothing here requires uv to run an agent.
[tool.uv.workspace]
members = ["packages/*/*"]

[tool.uv.sources]
orexis = { workspace = true }
orexis-bus-i2c = { workspace = true }
orexis-bus-onewire = { workspace = true }
orexis-capability-actuation = { workspace = true }
orexis-capability-market = { workspace = true }
orexis-capability-reporting = { workspace = true }
orexis-capability-review = { workspace = true }
orexis-capability-sensing = { workspace = true }
orexis-codec-json = { workspace = true }
orexis-part-bme280 = { workspace = true }
orexis-part-device = { workspace = true }
orexis-part-dht11 = { workspace = true }
orexis-part-esp32 = { workspace = true }
orexis-part-microcontroller = { workspace = true }
orexis-part-moisture-probe = { workspace = true }
orexis-part-rgb-led = { workspace = true }
orexis-plant-water = { workspace = true }
orexis-plant-zamioculcas = { workspace = true }
orexis-scaling-identity = { workspace = true }
orexis-sim-standin = { workspace = true }
orexis-tool-wokwi = { workspace = true }
orexis-transport-mqtt = { workspace = true }

[tool.pytest.ini_options]
# BOTH roots. `tests/` is the integration suite — most of what this project asserts is about the
# merged graph, and a shape or a rules.ru cannot be exercised without every package's T-Box. A
# package may also carry its OWN tests, as plain `test_*.py` files beside the code they cover,
# for the rare thing that means something alone: `packages/capability/market/test_auction.py`
# is pay-as-bid and uniform-price arithmetic, and needs no world at all.
#
# `packages` must be named here or those files are invisible. Measured: with `testpaths =
# ["tests"]`, neither `pytest tests` NOR a bare `pytest` collects a test file inside a package —
# it runs only when named by path, so the suite would have gone green while skipping it.
testpaths = ["tests", "packages"]

addopts = "-n auto"

# Parallel by default, which is only defensible because #271 made the vacuity guard survive a
# worker. Read that before removing the flag or trusting a green run.
#
# The suite is pyshacl-bound and embarrassingly parallel: 772s serial against 362s on the Pi's
# four cores. It used to be OFF, because a worker process SILENTLY DISABLED the guard in the
# repo-root `conftest.py` — the one this project added after four guards went green while
# checking nothing (#106). The tally and the verdict both lived in the worker, whose
# `session.exitstatus` xdist does not propagate and whose stdout it discards on a passing run.
#
# The verdict now travels over `workeroutput` and the controller SUMS the tallies per test
# function before judging. Re-measured with a probe whose assert sits in a loop over an empty
# call result, and it now fails the run in every mode rather than only serially:
#
#     pytest <probe>                          -> exit 1, guard names the test
#     pytest <probe> -n 0                     -> exit 1, guard names the test
#     pytest <probe> -n auto                  -> exit 1, guard names the test
#     pytest <probe> -n auto --dist loadfile  -> exit 1, guard names the test
#     pytest <probe> -n auto --dist loadscope -> exit 1, guard names the test
#
# Summing is the load-bearing word and not an implementation detail: `--dist load` splits a
# parametrised function's cases across workers, and `test_queries_use_only_declared_prefixes`
# legitimately asserts nothing for most of its 261, so believing any single worker would bring
# back the 54 false positives #106 was careful to avoid.
#
# ONE THING THIS BREAKS. `pytest infra` must be run as `pytest infra -n0`. Those eight tests are
# a contract with a LIVE broker and store, and they rewrite one `acl.conf` and one `passwd` in
# place and restore them byte for byte. The principals are uniquely named per probe, so the
# collision is not obvious, but two workers restoring the same file discard each other's block —
# and the failure mode is not a loud error, it is a grant test passing against an ACL somebody
# else wrote. They are the one suite here whose isolation is not structural.

# ---------------------------------------------------------------------------------------------
# The layering, stated and checked rather than implied by a directory.
#
# It is one-way and always was: onboarding reads the model an agent runs on. What the two
# distributions could never express is the direction — pip is happy to install either alone,
# and says nothing about who may import whom.
#
#   .venv/bin/lint-imports
[tool.importlinter]
root_packages = ["assembly", "agent", "packages", "onboarding"]

[[tool.importlinter.contracts]]
# ASSEMBLY IS UNDER EVERYTHING. It finds packages and owns the extension mechanism; the kernel
# is one of the things it assembles, so it must not know the kernel exists. It names `agent/`
# by PATH — a directory it merges first — and never by import
# (the-assembly-is-not-the-mind).
name = "What assembles a build does not import what it assembles"
type = "forbidden"
source_modules = ["assembly"]
forbidden_modules = ["agent", "onboarding", "packages"]

[[tool.importlinter.contracts]]
name = "The agent never reaches for the operator's tools"
type = "forbidden"
source_modules = ["agent"]
forbidden_modules = ["onboarding"]

[[tool.importlinter.contracts]]
# THE ONE THIS SERIES EARNED. The kernel is what LOADS packages; it must never reach into one.
# This could not be stated before, and the violations were not theoretical: `agent/desire.py`
# and `agent/genesis.py` imported `packages.capability.desire.graphs` — a module that did
# nothing but re-export `agent.ontology.obligations_graph`, so the kernel was importing a
# package to get its own function back. `agent/intentions.py` imported the intention package
# to name the ledger graph. Nothing forbade any of it, and nothing noticed.
#
# With the mind in the kernel there is nothing left to reach for, so the rule can be a contract
# instead of a habit. What it protects is the claim the whole arrangement rests on: every
# package is optional, which is only true if the kernel never needs one.
name = "The kernel loads packages and never reaches into one"
type = "forbidden"
source_modules = ["agent"]
forbidden_modules = ["packages"]

[[tool.importlinter.contracts]]
# A capability that imported onboarding would put credential-minting code on the far side of a
# boundary the image is built to keep it out of.
name = "No package reaches for them either"
type = "forbidden"
source_modules = ["packages"]
forbidden_modules = ["onboarding"]

[[tool.importlinter.contracts]]
# No capability imports another's Python: they meet through the T-Box, via agent.provider().
name = "Capability packages do not import each other"
type = "independence"
modules = [
    "packages.capability.actuation",
    "packages.capability.market",
    "packages.capability.sensing",
    "packages.capability.review",
]
