# SPEECH: what is said, kept as said, and what the agent believes of it, extracted — ported from `agent/speech/*.py`
# beside it, held to what its suite asks (knowledge/decisions/the-agent-moves-to-rust-one-package-at-a-time.md).
[package]
name = "orexis-speech"
version = "0.2.0"
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
inventory.workspace = true
tokio.workspace = true
orexis = { workspace = true }
oxigraph.workspace = true
oxsdatatypes = "0.2"
log = "0.4"

[dev-dependencies]
orexis = { workspace = true, features = ["snapshots"] }
