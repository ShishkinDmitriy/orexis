# GENERATED by `agora-compose society` from genesis/society/world.ttl — do not edit.
#
# The roster is the ratified world. Add an agent there, regenerate, and it is deployed; there
# is no second list to keep in step. Run from this directory:
#
#   podman compose -f compose.society.yml up -d
#   podman compose -f compose.society.yml logs -f
#
# Infra (Fuseki, Influx, Grafana) lives in the repo-root docker-compose.yml and is not repeated
# here — bring it up first. The MQTT broker runs on the host; see infra/mosquitto/lan.conf.
#
# This world has its OWN Fuseki dataset (/ds-society), so bringing it up cannot disturb another
# world's beliefs or readings. Two worlds may run at once as far as the belief base is
# concerned — but only if their DEVICES differ, since two agents on one topic both ingest.

name: agora-society

# podman-compose puts every service in one pod by default, and a pod cannot combine with the
# per-service user-namespace mapping below ("--userns and --pod cannot be set together"). The
# mapping is the thing that makes an agent able to read its own credential and nothing else, so
# the pod is what gives way. Ignored by docker compose, which does not create pods at all.
x-podman:
  in_pod: false

services:
  # Genesis. Runs to completion, then the agents start — an agent against an unseeded store
  # fails on its first read, loudly and pointlessly.
  seed:
    image: agora:local
    command: ["agora-seed", "society"]
    env_file: [../.env]
    network_mode: host
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: "no"
    volumes:
      - ../genesis:/app/genesis:ro
      - ../capabilities:/app/capabilities:ro
      - ../transports:/app/transports:ro
      - ../domain:/app/domain:ro
      - ../kernel:/app/kernel:ro
      - ../backend/src/agora:/app/backend/src/agora:ro

  agent-fern:
    image: agora:local
    command: ["agora-agent"]
    environment:
      AGORA_AGENT_ID: "fern"
      # An agent is told its own id and where the belief base is — nothing else. Each world
      # has its own dataset, so this is how a container knows which society it is part of,
      # without the agent ever learning the concept of a "world".
      FUSEKI_URL: "${FUSEKI_BASE:-http://localhost:3030}/ds-society"
    env_file: [../.env]
    network_mode: host
    # Rootless podman maps YOUR uid into the container. Without this it lands on a subuid that
    # cannot read a 0600 credential owned by you, so the agent falls back to admin — silently
    # undoing the isolation. Map it onto the image's unprivileged user instead.
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      # exactly one credential: its own. This is the isolation the ACL assumes.
      - ../keys/fuseki/fern.pw:/app/keys/fuseki/fern.pw:ro
      # the discovered trees, mounted so a code change needs a restart, not a rebuild
      - ../capabilities:/app/capabilities:ro
      - ../transports:/app/transports:ro
      - ../domain:/app/domain:ro
      - ../kernel:/app/kernel:ro
      - ../backend/src/agora:/app/backend/src/agora:ro

  agent-succulent:
    image: agora:local
    command: ["agora-agent"]
    environment:
      AGORA_AGENT_ID: "succulent"
      # An agent is told its own id and where the belief base is — nothing else. Each world
      # has its own dataset, so this is how a container knows which society it is part of,
      # without the agent ever learning the concept of a "world".
      FUSEKI_URL: "${FUSEKI_BASE:-http://localhost:3030}/ds-society"
    env_file: [../.env]
    network_mode: host
    # Rootless podman maps YOUR uid into the container. Without this it lands on a subuid that
    # cannot read a 0600 credential owned by you, so the agent falls back to admin — silently
    # undoing the isolation. Map it onto the image's unprivileged user instead.
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      # exactly one credential: its own. This is the isolation the ACL assumes.
      - ../keys/fuseki/succulent.pw:/app/keys/fuseki/succulent.pw:ro
      # the discovered trees, mounted so a code change needs a restart, not a rebuild
      - ../capabilities:/app/capabilities:ro
      - ../transports:/app/transports:ro
      - ../domain:/app/domain:ro
      - ../kernel:/app/kernel:ro
      - ../backend/src/agora:/app/backend/src/agora:ro

  agent-supplier:
    image: agora:local
    command: ["agora-agent"]
    environment:
      AGORA_AGENT_ID: "supplier"
      # An agent is told its own id and where the belief base is — nothing else. Each world
      # has its own dataset, so this is how a container knows which society it is part of,
      # without the agent ever learning the concept of a "world".
      FUSEKI_URL: "${FUSEKI_BASE:-http://localhost:3030}/ds-society"
    env_file: [../.env]
    network_mode: host
    # Rootless podman maps YOUR uid into the container. Without this it lands on a subuid that
    # cannot read a 0600 credential owned by you, so the agent falls back to admin — silently
    # undoing the isolation. Map it onto the image's unprivileged user instead.
    userns_mode: "keep-id:uid=10001,gid=10001"
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      # exactly one credential: its own. This is the isolation the ACL assumes.
      - ../keys/fuseki/supplier.pw:/app/keys/fuseki/supplier.pw:ro
      # it actuates, so it co-signs — the two keys and nothing else
      - ../keys/host.key:/app/keys/host.key:ro
      - ../keys/clearing.key:/app/keys/clearing.key:ro
      # the discovered trees, mounted so a code change needs a restart, not a rebuild
      - ../capabilities:/app/capabilities:ro
      - ../transports:/app/transports:ro
      - ../domain:/app/domain:ro
