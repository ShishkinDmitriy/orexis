[project]
name = "agora"
version = "0.1.0"
description = "Agora — a market society of agents that bid for a scarce resource"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.0",
    "pyoxigraph>=0.4",
    "influxdb-client>=1.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyshacl>=0.26",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agora-agent = "agora.runtime:main"
agora-validate = "agora.validate:main"
agora-keygen = "agora.signing:main"
# agora-onboard / -influx / -mqtt / -compose are NOT here. They mint credentials from a world
# and one of them reads the admin token, so they live in ../onboarding and are installed
# separately — an agent image copies backend/ wholesale, and the surest way for an agent never
# to hold the admin token is for that code to be absent from it.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
