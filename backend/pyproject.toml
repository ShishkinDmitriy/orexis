[project]
name = "agora"
version = "0.1.0"
description = "Agora — a market society of agents that bid for a scarce resource"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.0",
    "pyoxigraph>=0.4",
    "influxdb-client>=1.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyshacl>=0.26",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agora-agent = "agora.runtime:main"
agora-compose = "agora.compose:main"
agora-validate = "agora.validate:main"
agora-keygen = "agora.signing:main"
# The two provisioning tools — one per backing service, so swapping either is swapping a tool
# and not rewriting the model. Both derive what they grant from the world's own wiring.
agora-influx = "agora.influx_admin:main"
agora-mqtt = "agora.mqtt_admin:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
