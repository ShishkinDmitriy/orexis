[project]
name = "agora"
version = "0.1.0"
description = "Agora — a market society of agents that bid for a scarce resource"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.0",
    "influxdb-client>=1.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyshacl>=0.26",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agora-agent = "agora.runtime:main"
agora-sim = "agora.simulator:main"
agora-seed = "agora.seed:main"
agora-validate = "agora.validate:main"
agora-keygen = "agora.signing:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
