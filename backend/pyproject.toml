[project]
name = "agora"
version = "0.1.0"
description = "Agora — agent society v1 (gateway slice)"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.0",
    "influxdb-client>=1.40",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agora-gateway = "agora.gateway:main"
agora-fake-sensor = "agora.fake_sensor:main"
agora-round = "agora.live:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
