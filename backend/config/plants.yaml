# The three v1 plants and the gateway's numeric->qualitative thresholds.
#
# The threshold lives HERE (gateway config), never in ESP32 firmware — one authority,
# recalibrate without a reflash. See knowledge/domain/gateway.md and
# knowledge/decisions/two-store-beliefs.md.

# This whole file is the ratified world (v1, hand-authored — the output of genesis):
# "ratified belief owned by parties". Topology + charters seed the belief base (agora-seed);
# the gateway owns the thresholds; the supplier owns its terms. See
# knowledge/decisions/genesis.md.

# Bumped by hand on each re-genesis; stamped onto every attestation as provenance.
world_version: 1

# Topology (structure): which source waters which plants, and who supplies it.
sources:
  - id: barrel1
    supplier: supplier

# Each plant's charter: identity + desire (target moisture) + endowment (starting credits)
# + which source it draws from (its cluster).
plants:
  - id: fern
    uri: "http://example.org/agora#fern"
    species: fern
    sensor: moisture_sensor_fern
    source: barrel1
    target: 0.55
    endowment: 100.0
  - id: tomato
    uri: "http://example.org/agora#tomato"
    species: tomato
    sensor: moisture_sensor_tomato
    source: barrel1
    target: 0.50
    endowment: 100.0
  - id: succulent
    uri: "http://example.org/agora#succulent"
    species: succulent
    sensor: moisture_sensor_succulent
    source: barrel1
    target: 0.22
    endowment: 100.0

# band = LOW if value < low; HIGH if value > high; else OK.
# Per-species dry points (fern likes it wet, succulent likes it dry).
species_bands:
  fern:      { low: 0.35, high: 0.65 }
  tomato:    { low: 0.30, high: 0.60 }
  succulent: { low: 0.12, high: 0.30 }

# The deterministic value model (a seam — replaceable). Converts a moisture deficit into
# a litres demand and a willingness-to-pay. See knowledge/decisions/deterministic-bid.md.
value_model:
  litres_per_fraction: 2.0   # L needed to raise moisture by 1.0 (pot-size proxy)
  max_value_per_l: 0.80      # €/L willingness at peak urgency (bone dry)

# The supplier's round terms (v1: fixed). The host announces this quantity + reserve.
supplier:
  id: supplier
  quantity_l: 2.0            # litres available this round
  reserve_price_per_l: 0.20  # won't sell below this (€/L)
  tank_capacity_l: 5.0       # constitution: total allocation ceiling

# Executor dosing (RPi -> pump). ml_per_second calibrates litres -> open time;
# max_dose_ml is a hard edge cap (defence-in-depth).
executor:
  ml_per_second: 10.0
  max_dose_ml: 1000.0
